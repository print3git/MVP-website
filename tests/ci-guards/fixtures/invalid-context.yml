name: bad
on: push
permissions:
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            try {
              const runId = github.context.runId;
              core.notice(runId);
            } catch (error) {
              core.setFailed(error.message);
            }
