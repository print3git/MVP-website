name: bad
on: push
permissions:
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            try {
              const { owner, repo } = context.repo;
              await github.rest.repos.get({ owner: 'foo', repo: 'bar' });
            } catch (error) {
              core.setFailed(error.message);
            }
