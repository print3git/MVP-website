name: bad
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            try {
              const { owner, repo } = context.repo;
              await github.rest.repos.get({ owner, repo });
            } catch (error) {
              core.setFailed(error.message);
            }
