name: bad
on: push
permissions:
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            try {
              const token = process.env.GITHUB_TOKEN;
              core.notice(token);
            } catch (error) {
              core.setFailed(error.message);
            }
