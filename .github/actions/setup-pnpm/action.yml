name: Setup pnpm
description: Configure pnpm via corepack
runs:
  using: composite
  steps:
    - name: Setup env aliases
      shell: bash
      run: echo "BASH_ENV=$GITHUB_WORKSPACE/scripts/env/aliases.sh" >> "$GITHUB_ENV"
    - run: corepack enable
      shell: bash
    - run: corepack prepare pnpm@9.0.0 --activate
      shell: bash
    - run: echo "PNPM_HOME=$HOME/.local/share/pnpm" >> $GITHUB_ENV
      shell: bash
    - run: echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH
      shell: bash
