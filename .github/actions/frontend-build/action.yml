name: Frontend Build
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install deps
      shell: bash
      run: npm ci
      working-directory: frontend
    - name: Build
      shell: bash
      run: npm run build
      working-directory: frontend
    - uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist
