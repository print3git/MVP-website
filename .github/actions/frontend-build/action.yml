name: Frontend Build
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Enable pnpm
      shell: bash
      run: corepack enable
    - name: Install vite
      shell: bash
      working-directory: frontend
      run: pnpm add -D vite --no-save
    - name: Build
      shell: bash
      working-directory: frontend
      run: pnpm run build
    - name: Verify dist
      shell: bash
      working-directory: frontend
      run: |
        test -f dist/index.html || { echo 'dist/index.html missing after build'; exit 1; }
    - uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist
