name: Frontend Build
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: ./.github/actions/setup-pnpm
    - name: Install frontend deps
      run: pnpm install --no-frozen-lockfile
      shell: bash
      working-directory: frontend
    - name: Build
      run: pnpm run build
      shell: bash
      working-directory: frontend
    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist
