name: Frontend Build
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Enable corepack
      shell: bash
      run: corepack enable
    - name: Install deps
      shell: bash
      run: pnpm install --no-frozen-lockfile
      working-directory: frontend
    - name: Build
      shell: bash
      run: pnpm run build
      working-directory: frontend
    - uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist
