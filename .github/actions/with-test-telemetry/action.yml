name: With Test Telemetry
description: Run tests and emit telemetry
inputs:
  run:
    description: Command to run tests (should generate a JSON report via --json --outputFile)
    required: true
  results-file:
    description: Path to JSON results file generated by the test command
    required: true
  package-manager:
    description: Package manager used for the project (npm or pnpm)
    default: npm
outputs:
  tests_count:
    value: ${{ steps.telemetry.outputs.tests_count }}
  failures_count:
    value: ${{ steps.telemetry.outputs.failures_count }}
  duration_ms:
    value: ${{ steps.run.outputs.duration_ms }}
runs:
  using: composite
  steps:
    - name: Enable corepack / install deps
      shell: bash
      run: |
        corepack enable
        if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
          pnpm install --no-frozen-lockfile
        fi
    - name: Run tests
      id: run
      shell: bash
      run: |
        start=$(date +%s%3N)
        set +e
        ${{ inputs.run }}
        status=$?
        set -e
        end=$(date +%s%3N)
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "duration_ms=$((end-start))" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Process telemetry
      id: telemetry
      if: always()
      shell: bash
      run: |
        file='${{ inputs.results-file }}'
        if [ -f "$file" ]; then
          tests=$(node -pe "require('./$file').numTotalTests || 0")
          failures=$(node -pe "require('./$file').numFailedTests || 0")
        else
          echo "Warning: test results file '$file' not found" >&2
          tests=0
          failures=0
        fi
        duration=${{ steps.run.outputs.duration_ms }}
        cat <<JSON > test-telemetry.json
        {
          "job": "$GITHUB_JOB",
          "runs_on": "$RUNNER_OS",
          "tests_count": $tests,
          "failures_count": $failures,
          "duration_ms": $duration
        }
        JSON
        echo "tests_count=$tests" >> "$GITHUB_OUTPUT"
        echo "failures_count=$failures" >> "$GITHUB_OUTPUT"
        echo "duration_ms=$duration" >> "$GITHUB_OUTPUT"
        echo '### Test telemetry' >> "$GITHUB_STEP_SUMMARY"
        echo "tests_count: $tests" >> "$GITHUB_STEP_SUMMARY"
        echo "failures_count: $failures" >> "$GITHUB_STEP_SUMMARY"
        echo "duration_ms: $duration" >> "$GITHUB_STEP_SUMMARY"
        if [ -f ci-test-inventory.json ]; then
          jq '. + [input]' ci-test-inventory.json test-telemetry.json > ci-test-inventory.tmp && mv ci-test-inventory.tmp ci-test-inventory.json
        else
          jq -s '.' test-telemetry.json > ci-test-inventory.json
        fi
    - name: Fail if tests failed
      shell: bash
      run: exit ${{ steps.run.outputs.status }}
