name: Endpoint Health

env:
  HUSKY: 0


on:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    timeout-minutes: 15
    runs-on: [self-hosted, linux, aws]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: Check homepage
        run: curl -fsS https://print2.io/ > /dev/null
