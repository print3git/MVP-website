name: Endpoint Health
env:
  HUSKY: 0

on:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check homepage
        run: curl -fsS https://print2.io/ > /dev/null
