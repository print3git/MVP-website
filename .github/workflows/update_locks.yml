name: Update Locks

env:
  HUSKY: 0


on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    timeout-minutes: 15
    runs-on:
      - [self-hosted, linux, aws, small]
      - ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run update_locks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_locks.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain CURRENT_LOCKS.json)" ]; then
            git add CURRENT_LOCKS.json
            git commit -m "Update CURRENT_LOCKS.json" && git push
          fi
