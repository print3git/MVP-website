name: Environment parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  env-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            backend/dalle_server/package-lock.json
            pnpm-lock.yaml
      - run: echo "cache-hit: ${{ steps.setup-node.outputs.cache-hit }}"
      - name: Record environment
        run: |
          {
            echo "node: $(node -v)"
            echo "npm: $(npm -v)"
            echo "vite: $(which vite || echo 'not found')"
            echo "tsc: $(which tsc || echo 'not found')"
          } > env-summary.txt
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: env-summary
          path: env-summary.txt
          if-no-files-found: error
