name: Backend Smoke

env:
  HUSKY: 0

on:
  workflow_run:
    workflows: ["Preflight"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/preflight.yml

  db-seed:
    timeout-minutes: 15
    needs: preflight
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Seed database
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/test
        run: npm run seed --prefix backend
      - name: Dump database
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: test
        run: pg_dump --format=custom -f seeded-db.dump
      - name: Upload seeded database
        uses: actions/upload-artifact@v4
        with:
          name: seeded-db
          path: seeded-db.dump

  backend-smoke:
    needs: [preflight, db-seed]
    if: needs.preflight.outputs.run_backend == 'true'
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: |
          for attempt in 1 2; do
            if npm ci --prefix backend; then
              break
            elif [ $attempt -eq 2 ]; then
              exit 1
            else
              sleep $((2**attempt))
            fi
          done
      - name: Download seeded database
        uses: actions/download-artifact@v4
        with:
          name: seeded-db
      - name: Restore database
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: test
        run: pg_restore --clean --no-owner -d test seeded-db.dump
      - name: Lint
        run: npm run lint --prefix backend
      - name: Healthz test
        run: npm --prefix backend test -- backend/tests/healthz.test.js
      - name: Generate API test
        run: npm --prefix backend test -- backend/tests/api.test.js -t "POST /api/generate returns glb url"
