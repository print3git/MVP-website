name: Backend Smoke

on:
  push:
  merge_group:

permissions:
  contents: read

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm run build:frontend
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Lint
        run: npm run lint --prefix backend
      - name: Healthz test
        run: npm --prefix backend test -- backend/tests/healthz.test.js
      - name: Generate API test
        run: npm --prefix backend test -- backend/tests/api.test.js -t "POST /api/generate returns glb url"
