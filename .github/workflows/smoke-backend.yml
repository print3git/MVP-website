name: Backend Smoke

env:
  HUSKY: 0

on:
  push:
    branches: [00000production]
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-full')
    uses: ./.github/workflows/preflight.yml

  backend-smoke:
    needs: preflight
    if: needs.preflight.outputs.run_backend == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-full'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: |
          for attempt in 1 2; do
            if npm ci --prefix backend; then
              break
            elif [ $attempt -eq 2 ]; then
              exit 1
            else
              sleep $((2**attempt))
            fi
          done
      - name: Lint
        run: npm run lint --prefix backend
      - name: Healthz test
        run: npm --prefix backend test -- backend/tests/healthz.test.js
      - name: Generate API test
        run: npm --prefix backend test -- backend/tests/api.test.js -t "POST /api/generate returns glb url"
