name: Backend Smoke

env:
  HUSKY: 0


on:
  push:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-smoke:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: |
          for attempt in 1 2; do
            if npm ci --prefix backend; then
              break
            elif [ $attempt -eq 2 ]; then
              exit 1
            else
              sleep $((2**attempt))
            fi
          done
      - name: Lint
        run: npm run lint --prefix backend
      - name: Healthz test
        run: npm --prefix backend test -- backend/tests/healthz.test.js
      - name: Generate API test
        run: npm --prefix backend test -- backend/tests/api.test.js -t "POST /api/generate returns glb url"
