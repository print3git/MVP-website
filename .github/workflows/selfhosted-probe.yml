name: Self-hosted runner probe

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

env:
  # Ensure at least two warm runners are always online
  MIN_RUNNERS: ${{ vars.MIN_SELF_HOSTED_RUNNERS || 2 }}

jobs:
  probe-selfhosted:
    name: Probe self-hosted runner
    runs-on: [self-hosted, linux, aws, mvp-runner]
    timeout-minutes: 5
    outputs:
      queue_latency: ${{ steps.latency.outputs.queue_latency }}
    steps:
      - name: Runner context
        run: echo '${{ toJSON(runner) }}'
      - name: Verify self-hosted capacity
        id: capacity
        uses: actions/github-script@v7.0.1
        env:
          required: ${{ env.MIN_RUNNERS }}
        with:
          script: |
            const required = parseInt(process.env.required || '1', 10);
            const runners = await github.paginate(
              github.rest.actions.listSelfHostedRunnersForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
              }
            );
            const online = runners.filter(
              (r) =>
                r.status === 'online' &&
                r.labels.some((l) => l.name === 'mvp-runner')
            ).length;
            core.info(`Online mvp-runner runners: ${online}`);
            if (online < required) {
              core.setFailed(
                `Only ${online} self-hosted runners online; need at least ${required}.`
              );
            }
      - name: Node version
        run: node -v
      - name: npm version
        run: npm -v
      - name: Measure queue latency
        id: latency
        run: |
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          created_at="${{ github.event.created_at }}"
          queue_latency=$(( $(date -u -d "$now" +"%s") - $(date -u -d "$created_at" +"%s") ))
          echo "queue_latency=$queue_latency" | tee latency.txt
          echo "queue_latency=$queue_latency" >> "$GITHUB_OUTPUT"
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          name: probe-${{ github.run_id }}
          path: latency.txt

  timeout-notice:
    if: ${{ needs.probe-selfhosted.result != 'success' }}
    needs: probe-selfhosted
    runs-on: ubuntu-latest
    steps:
      - name: No runner available
        run: echo "Self-hosted runner not available. Run 'terraform apply' to provision." >> "$GITHUB_STEP_SUMMARY"
