name: CI Gate Audit
on:
  pull_request:
  push:
    branches: [00000production]
  schedule:
    - cron: "17 7 * * *"
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci || pnpm install || yarn install
      - run: npm run ci-gate:audit
      - run: npm run test:ci-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-gate-report
          path: ci-reports/ci-gate.json
      - name: Open issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "CI Gate Audit failed – prevent mass-skip"
          content-filepath: ci-reports/ci-gate.json
          labels: ci,blocking
  autofix:
    needs: audit
    if: needs.audit.result == 'failure'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci || pnpm install || yarn install
      - run: tsx scripts/ci-gate/fix.ts
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "ci: auto-fix fast-lane gating"
          title: "ci: auto-fix fast-lane gating"
          body: "Automated fix generated by CI Gate Audit."
          branch: "ci/autofix-fast-lane"
          labels: ci,automation
