name: Spellcheck

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'

jobs:
  codespell:
    runs-on: [self-hosted, linux, aws]
    steps:
      - uses: actions/checkout@v5
      - uses: codespell-project/actions-codespell@v2.1
        with:
          ignore_words_file: docs/codex/spellcheck-wordlist.txt
          check_filenames: true
          check_hidden: true
