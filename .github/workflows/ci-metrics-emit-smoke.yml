name: CI Metrics Emit Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create sample data
        run: |
          mkdir -p tmp
          cat <<'TIMINGS' > tmp/timings.json
          { "job1": { "queued_at": "2025-08-01T00:00:00Z", "started_at": "2025-08-01T00:00:30Z", "conclusion": "success" } }
          TIMINGS
          cat <<'INVENTORY' > tmp/inventory.json
          { "suites": [ { "tests": [ { "name": "t1", "outcome": "success" } ] } ] }
          INVENTORY
      - uses: ./.github/actions/ci-metrics-emit
        with:
          timings: tmp/timings.json
          inventory: tmp/inventory.json
      - name: Verify metrics and artifact
        run: |
          test -s ci/metrics/series.ndjson
          gh run artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
