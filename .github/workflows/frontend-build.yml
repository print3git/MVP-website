name: Frontend build

on:
  pull_request:
    paths:
      - "frontend/**"
      - "!docs/**"
      - "pnpm-lock.yaml"

jobs:
  fastlane:
    uses: ./.github/workflows/_aws-fastlane.yml
    secrets: inherit
    with:
      script: |
        cd frontend
        pnpm install --no-frozen-lockfile
        pnpm run build
        test -d dist
        node ../scripts/assert-frontend-dist.js
      artifact-name: frontend-dist
      artifact-path: frontend/dist

  fallback:
    if: failure()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5.0.0
      - run: corepack enable
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 8.15.8
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - run: test -d dist
      - run: node ../scripts/assert-frontend-dist.js
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
