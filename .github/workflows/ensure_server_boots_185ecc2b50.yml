name: Ensure Server Boots

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot_check:
    runs-on: ubuntu-latest
    env:
      STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
      # Fallback DB connection so check-env.sh passes
      DB_URL: ${{ secrets.DB_URL || 'postgres://user:pass@localhost:5432/testdb' }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      CLOUDFRONT_MODEL_DOMAIN: ${{ secrets.CLOUDFRONT_MODEL_DOMAIN }}
      SPARC3D_ENDPOINT: ${{ secrets.SPARC3D_ENDPOINT }}
      SPARC3D_TOKEN: ${{ secrets.SPARC3D_TOKEN }}
      STABILITY_KEY: ${{ secrets.STABILITY_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PORT: 3000
      CI_REQUIRE_EXTERNAL: '0'
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Load Stripe env
        run: node scripts/ci-env-preflight.js
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm run setup

      - name: Start backend
        env:
          STRIPE_TEST_KEY: ${{ env.STRIPE_TEST_KEY }}
          DB_URL: ${{ env.DB_URL }}
          HF_API_KEY: ${{ env.HF_API_KEY }}
          CLOUDFRONT_MODEL_DOMAIN: ${{ env.CLOUDFRONT_MODEL_DOMAIN }}
          SPARC3D_ENDPOINT: ${{ env.SPARC3D_ENDPOINT }}
          SPARC3D_TOKEN: ${{ env.SPARC3D_TOKEN }}
          STABILITY_KEY: ${{ env.STABILITY_KEY }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ env.S3_BUCKET }}
          HF_TOKEN: ${{ env.HF_TOKEN }}
          PORT: ${{ env.PORT }}
          CI_REQUIRE_EXTERNAL: ${{ env.CI_REQUIRE_EXTERNAL }}
        run: |
          npm run start:backend 2>&1 | tee /tmp/server.log &
          echo $! > /tmp/server.pid
        shell: bash

      - name: Wait for backend
        run: |
          npx wait-on http://localhost:3000/healthz --timeout 90000 || {
            echo "Server failed to start";
            cat /tmp/server.log;
            exit 1;
          }
        shell: bash

      - name: Probe health endpoint
        run: curl -fsS http://localhost:3000/healthz | jq -e '.ok==true'

      - name: Run backend tests
        run: npm test --prefix backend

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
          fi
          sleep 5
          cat /tmp/server.log || true
        shell: bash
