name: Debugging the basket on index.html

on:
  push:
    branches: [dev, 00000production]
  pull_request:
    branches: [dev, 00000production]

jobs:
  basket-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Run basket pipeline tests
        run: node scripts/run-jest.js tests/frontend/basket-pipeline.*.test.js --runInBand --verbose
