name: lfs-audit

on:
  pull_request:
  push:
    branches:
      - '00000production'

jobs:
  lfs-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test:lfs
