name: CodeQL

env:
  HUSKY: 0
  CODEQL_ACTION_FEATURE_MULTI_LANGUAGE: false
  CODEQL_BUNDLE: ${{ runner.temp }}/codeql-bundle


on:
  push:
    branches: [dev]
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'security/')
    name: Analyze
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Verify code scanning enabled
        run: node scripts/check-code-scanning.js
      - name: Cache CodeQL bundle
        uses: actions/cache@v4
        with:
          path: ${{ env.CODEQL_BUNDLE }}
          key: ${{ runner.os }}-codeql-bundle-${{ hashFiles('.github/workflows/codeql.yml') }}
          restore-keys: |
            ${{ runner.os }}-codeql-bundle-
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.29.9
        with:
          languages: javascript-typescript
      - name: CodeQL CLI version
        run: codeql --version
        shell: bash
      - name: Build
        run: |
          npm ci
          npm --prefix backend ci
          npm run build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3.29.9
        with:
          upload: true
