name: CodeQL

env:
  HUSKY: 0
  CODEQL_ACTION_FEATURE_MULTI_LANGUAGE: false


on:
  push:
    branches: [dev]
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'security/')
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codeql-version: ["2.22.4"]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: 'npm'
      - name: Verify code scanning enabled
        run: node scripts/check-code-scanning.js
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.29.9
        with:
          languages: javascript-typescript
          tools: ${{ matrix.codeql-version }}
      - name: Build
        run: |
          npm ci
          npm --prefix backend ci
          npm run build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3.29.9
        with:
          upload: true
