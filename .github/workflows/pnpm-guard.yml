name: pnpm guard

on:
  push:
    branches:
      - dev
      - 00000production
  pull_request:
    branches:
      - dev
      - 00000production
  workflow_call:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Guard single lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] && [ -f pnpm-lock.yaml ]; then
            echo "::error::Both npm and pnpm lockfiles present"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
