name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: Use self-hosted runners
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    uses: ./.github/workflows/_setup.yml
    with:
      run: npx tsc --noEmit
      use_self_hosted: ${{ inputs.use_self_hosted }}
