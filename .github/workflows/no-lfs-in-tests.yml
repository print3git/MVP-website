name: No LFS in Tests
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { lfs: false }
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
        env:
          ASTRONAUT_GLB_URL: ${{ secrets.ASTRONAUT_GLB_URL }}
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test
          SKIP_PW_DEPS: "1"
      - name: Fail if any LFS pointer exists under tests/**
        run: |
          set -euo pipefail
          BAD=$(git grep -l "version https://git-lfs.github.com/spec" -- tests || true)
          if [ -n "$BAD" ]; then
            echo "❌ LFS pointers found under tests/:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ No LFS pointers under tests/"
