name: CI Inventory Comment

on:
  pull_request:
  workflow_run:
    workflows: ["Full CI Aggregate / all-suites"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download test inventory artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: ci-test-inventory
          path: .
          if-no-files-found: ignore
      - name: Move inventory file
        if: ${{ github.event_name == 'workflow_run' && hashFiles('ci-test-inventory/ci-test-inventory.json') != '' }}
        run: mv ci-test-inventory/ci-test-inventory.json ci-test-inventory.json
      - name: Comment with suite inventory
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-inventory-comment -->';
            const suitesPath = '.github/ci/expected-suites.yml';
            const raw = fs.readFileSync(suitesPath, 'utf8');
            const suites = raw.split(/\r?\n/)
              .map(l => l.replace(/#.*/, '').trim())
              .filter(l => l && !l.startsWith('suites:'))
              .map(l => l.replace(/^- /, '').trim());

            const { owner, repo } = context.repo;
            let runId;
            if (context.eventName === 'workflow_run') {
              runId = context.payload.workflow_run.id;
            } else {
              const headSha = context.payload.pull_request.head.sha;
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci-suite-restorer.yml',
                head_sha: headSha,
                event: 'pull_request',
                per_page: 1
              });
              runId = runs.data.workflow_runs[0]?.id;
            }
            if (!runId) {
              core.info('No target workflow run found, skipping.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runId
            });
            const executed = jobs.map(j => j.name);
            const present = suites.filter(s => executed.includes(s));
            const missing = suites.filter(s => !executed.includes(s));

            let body = `${marker}\n### CI Suite Inventory`;
            for (const s of present) {
              body += `\n- ✅ ${s}`;
            }
            for (const s of missing) {
              body += `\n- ❌ ${s} (missing workflow file, event filter, path filter, or if condition)`;
            }
            if (fs.existsSync('ci-test-inventory.json')) {
              const json = fs.readFileSync('ci-test-inventory.json', 'utf8');
              body += `\n\n<details><summary>ci-test-inventory.json</summary>\n\n\`\`\`json\n${json}\n\`\`\`\n</details>`;
            }

            const prNumber = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.pull_requests[0]?.number
              : context.payload.pull_request.number;
            if (!prNumber) {
              core.info('No pull request context, skipping comment.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

            return;

