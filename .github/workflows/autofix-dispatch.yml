name: autofix-dispatch

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  AUTOFIX_MAX_GROUPS: "2"
  AUTOFIX_MAX_PRS_PER_GROUP: "2"

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm i
      - run: node scripts/autofix/codex-driver.js
