name: ec2 connect diagnose tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/run-jest.js tests/ci-guard/ec2-connect-diagnose/diagnose.test.ts
