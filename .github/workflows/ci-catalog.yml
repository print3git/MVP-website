name: CI Catalog

on:
  pull_request:
    paths:
      - 'ci/**'
      - '.github/workflows/**'
  push:
    paths:
      - 'ci/**'
      - '.github/workflows/**'

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: npm ci
      - name: Build catalog
        run: npx ts-node scripts/ci/generate-catalog.ts
      - name: Upload catalog
        uses: actions/upload-artifact@v4
        with:
          name: ci-catalog
          path: docs/ci/catalog.md
