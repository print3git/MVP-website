name: Markdown link check

on:
  pull_request:
    paths:
      - '**/*.md'

jobs:
  md-link-check:
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2.5.0
        with:
          args: --no-progress './**/*.md'
