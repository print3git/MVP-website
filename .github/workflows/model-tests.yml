name: Model Tests
on: [push, pull_request]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build --if-present
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test
      - run: |
          nohup npm run start > /tmp/app.log 2>&1 &
          npx wait-on http://localhost:3000 --timeout 180000
      - run: npx playwright test tests/e2e/model-loading.hf.spec.ts tests/e2e/model-fallbacks.spec.ts tests/e2e/a11y-model.spec.ts
    env:
      CI: "true"
      MODEL_LOAD_BUDGET_MS: "5000"

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test
      - run: npx lhci autorun --config=lighthouserc-model.json

      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build --if-present
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test
      - run: |
          nohup npm run start > /tmp/app.log 2>&1 &
          npx wait-on http://localhost:3000 --timeout 180000
      - run: npx playwright test tests/e2e/model-loading.hf.spec.ts tests/e2e/model-fallbacks.spec.ts tests/e2e/a11y-model.spec.ts
    env:
      CI: "true"
      MODEL_LOAD_BUDGET_MS: "5000"
