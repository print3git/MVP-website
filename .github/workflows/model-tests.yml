name: Model Tests
on: [push, pull_request]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      MODEL_LOAD_BUDGET_MS: "5000"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      # Install deps (root + frontend workspace)
      - run: npm ci
      - run: npm ci --prefix frontend

      # Browsers for Playwright
      - run: npx playwright install --with-deps chromium

      # Build the frontend explicitly (fixes @vitejs/plugin-react not found)
      - run: npm --prefix frontend run build

      # Lightweight env & tool sanity checks
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test

      # Serve the built site and wait until it's reachable
      - run: |
          nohup npm --prefix frontend run start:ci > /tmp/app.log 2>&1 &
          npx wait-on http://localhost:3000 --timeout 180000 || (cat /tmp/app.log && exit 1)

      # Run only the model-related e2e tests
      - run: |
          specs=(
            tests/e2e/model-loading.hf.spec.ts
            tests/e2e/model-fallbacks.spec.ts
            tests/e2e/a11y-model.spec.ts
          )
          present=()
          for file in "${specs[@]}"; do
            [[ -f "$file" ]] && present+=("$file")
          done
          if [ ${#present[@]} -eq 0 ]; then
            echo "::notice::No model test specs found; skipping"
            exit 0
          fi
          npx playwright test "${present[@]}" --pass-with-no-tests

  lighthouse:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      MODEL_LOAD_BUDGET_MS: "5000"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      # Install deps (root + frontend workspace)
      - run: npm ci
      - run: npm ci --prefix frontend

      # Build the frontend
      - run: npm --prefix frontend run build

      # Sanity checks
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test

      # Serve the built site and run Lighthouse CI against it
      - run: |
          nohup npm --prefix frontend run start:ci > /tmp/app.log 2>&1 &
          npx wait-on http://localhost:3000 --timeout 180000 || (cat /tmp/app.log && exit 1)
      - run: npx lhci autorun --config=lighthouserc-model.json
