name: CI Inventory
on:
  pull_request:
  push:
    branches: [00000production]
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || pnpm install || yarn install
      - run: npm run test:ci-inventory
