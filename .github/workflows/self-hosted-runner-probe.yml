name: Self-hosted runner probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, mvp-gh-runner]
    timeout-minutes: 5
    steps:
      - name: Gather info
        run: |
          echo "runner.name=$RUNNER_NAME"
          echo "runner.os=$RUNNER_OS"
          echo "runner.arch=$RUNNER_ARCH"
          java -version || true
          node -v || true
          df -h
          whoami
