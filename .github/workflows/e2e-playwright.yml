name: e2e Playwright

env:
  HUSKY: 0

on:
  push:
  pull_request:

concurrency: repo-ci

jobs:
  e2e:
    runs-on: [self-hosted, linux, x64, gha]
    permissions:
      contents: read
      issues: write
      pull-requests: write
    timeout-minutes: 30
    retries: 2
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm run setup
      - name: Create CI Playwright config
        run: |
          cat <<'EOF' > playwright.config.ci.ts
          import { defineConfig } from '@playwright/test';
          const baseURL = process.env.PLAYWRIGHT_BASE_URL || 'http://localhost:3000';
          export default defineConfig({
            testDir: 'e2e',
            timeout: 30_000,
            retries: 2,
            workers: '50%',
            forbidOnly: true,
            use: {
              baseURL,
              headless: true,
              ignoreHTTPSErrors: true,
              trace: 'retain-on-failure',
            },
            webServer: process.env.PLAYWRIGHT_BASE_URL
              ? undefined
              : {
                  command: 'node scripts/dev-server.js',
                  port: 3000,
                  timeout: 120_000,
                  reuseExistingServer: true,
                },
          });
          EOF
      - run: npm run e2e -- --config=playwright.config.ci.ts
      - name: Upload Playwright trace
        if: failure()
        id: upload-trace
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/**/trace.zip
          if-no-files-found: warn
      - name: Comment trace link
        if: failure() && github.event.pull_request
        env:
          TRACE_URL: ${{ steps.upload-trace.outputs['artifact-url'] }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `Playwright trace: https://trace.playwright.dev/?trace=${process.env.TRACE_URL}`,
              });
            } catch (e) {
              core.warning("Comment skipped: insufficient permissions (" + e.message + ")");
            }
