name: ci-tools smoke

on:
  pull_request:
    paths:
      - ".github/workflows/aws-gap-report.yml"
      - "scripts/ci-tools/**"
      - "tests/ci-tools/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm i
      - run: node scripts/ci-tools/scan-workflows.js --id-token
      - run: npm test -- -t scan-workflows
