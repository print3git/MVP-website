name: CI Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  probe_runner:
    uses: ./.github/workflows/_runner-probe.yml

  canary:
    needs: [probe_runner]
    runs-on: ${{ fromJSON(steps.resolve.outputs.value) }}
    steps:
      - name: Resolve runner choice
        id: resolve
        uses: ./.github/actions/resolve-runs-on
        with:
          online: ${{ needs.probe_runner.outputs.online }}
      - name: Print runner info
        run: |
          echo "Runner name: ${{ runner.name }}"
          echo "Runner OS: ${{ runner.os }}"
      - name: Disk usage
        run: df -h
      - name: Memory usage
        run: free -m
      - name: Node version
        run: node -v || true
      - name: Save canary
        run: echo "${{ runner.name }}:${{ runner.os }}" > canary.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: canary
          path: canary.txt
