name: Assets fetch smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/actions/fetch-repo-assets/**'
      - '.github/workflows/**'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch repo assets from S3
        uses: ./.github/actions/fetch-repo-assets
        with:
          bucket: glb-models-prod
          region: eu-north-1
          # role_to_assume / access keys are optional; your composite already no-ops if missing

      - name: List fetched assets (non-blocking)
        shell: bash
        run: |
          set -euo pipefail
          # Never fail if the folder is missing/empty
          mkdir -p repo-assets
      
          echo "=== repo-assets (first 200 files) ==="
          find repo-assets -type f | head -n 200 || true
      
          count="$(find repo-assets -type f | wc -l || echo 0)"
          echo "Total files: $count"
      
          if [ "$count" -eq 0 ]; then
            echo "::notice title=Repo assets::No binaries found in repo-assets; continuing."
            # do NOT exit non-zero
          fi

