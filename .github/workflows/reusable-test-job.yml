name: Reusable Test Job

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      command:
        required: true
        type: string

jobs:
  test:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail
    steps:
      # >>> BEGIN MANAGED BLOCK: ci-guard:diag-shell-fix
      - name: Shell sanity
        shell: bash
        run: echo "bash OK: $(bash --version | head -1)"
      # <<< END MANAGED BLOCK: ci-guard:diag-shell-fix
      - name: Preflight (print context)
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          NODE_VERSION: 20
        run: |
          set -x
          echo "Actor=${GITHUB_ACTOR:-unset} Ref=$GITHUB_REF SHA=$GITHUB_SHA"
          echo "Matrix node=${NODE_VERSION}"
          echo "Repo files snapshot:"
          git status --porcelain=v1 || true
          ls -la || true
          command -v node || true
          command -v npm || true
          command -v pnpm || true
          printenv | sort | sed -n '1,120p'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Corepack enable (safe)
        run: corepack enable || true
      - name: Lane Guard (required files)
        run: |
          set -e
          check() { [ -e "$1" ] || { echo "::error::Missing $1"; exit 86; }; }
          if [[ "${{ inputs.suite }}" == 'backend' ]]; then
            check package.json
            check backend/package.json
          fi
          if [[ "${{ inputs.suite }}" == 'frontend' ]]; then
            check package.json
            check frontend/package.json
          fi
          if [[ "${{ inputs.suite }}" == 'docs' ]]; then
            check docs || check documentation || true
          fi
          if [[ "${{ inputs.suite }}" == 'e2e' ]]; then
            test -f playwright.config.* || echo "::warning::No playwright config found (skipping host deps)"
          fi
      - name: Enable step debug
        if: ${{ always() }}
        run: echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
      - name: Run lane command
        if: ${{ inputs.suite != 'e2e' || !cancelled() }}
        run: ${{ inputs.command }}
      # >>> BEGIN MANAGED BLOCK: ci-guard:diag-shell-fix
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/diag
          if command -v dmesg >/dev/null 2>&1; then dmesg | tail -n 200 > ci/diag/dmesg.txt 2>/dev/null || true; fi
          if command -v journalctl >/dev/null 2>&1; then journalctl -xe --no-pager | tail -n 400 > ci/diag/journal.txt 2>/dev/null || true; fi
          git log -n 5 --oneline > ci/diag/gitlog.txt 2>/dev/null || true
          for d in frontend backend; do [ -d "$d" ] && cp -R "$d" "ci/diag/$d" 2>/dev/null || true; done
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ github.job }}-${{ github.run_id }}
          path: |
            ci/diag
            !ci/diag/**/node_modules/**
      # <<< END MANAGED BLOCK: ci-guard:diag-shell-fix
