name: Sync HF Space

env:
  HUSKY: 0


on:
  push:
    branches: [ dev ]          # ← adjust target branch if needed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
      PORT: 3000
      DB_URL: postgres://user:pass@localhost:5432/testdb

    steps:

      - name: Heartbeat

        run: |

          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - name: Load Stripe env
        run: node scripts/ci-env-preflight.js
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Install git-lfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-lfs
          git lfs install --skip-smudge --local

      - name: Sync Space
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_API_KEY: ${{ secrets.HF_TOKEN }}
        run: bash scripts/sync-space.sh

      - name: Force immediate sleep
        run: bash scripts/set-sleep-zero.sh
        env:
          HF_TOKEN:              ${{ secrets.HF_TOKEN }}
          HF_API_KEY:            ${{ secrets.HF_TOKEN }}
          SPARC3D_ENDPOINT:      ${{ secrets.SPARC3D_ENDPOINT }}
          SPARC3D_TOKEN:         ${{ secrets.SPARC3D_TOKEN }}
          STABILITY_KEY:         ${{ secrets.STABILITY_KEY }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET:             ${{ secrets.S3_BUCKET }}


      - name: Run backend tests
        run: npm run coverage --prefix backend

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
        continue-on-error: true
      - name: Ensure frontend build output exists
        run: node -e "require('fs').accessSync('frontend/dist/index.html')"

      - name: Run smoke tests
        run: npm run smoke
