name: Node Version Guard
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: |
          echo "Node: $(node -v)"
          node -e "process.exit(/^v20\./.test(process.version)?0:1)"
          npm -v
