name: cache-warmup

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  warmup:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npx playwright install --with-deps
