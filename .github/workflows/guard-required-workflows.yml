name: Guard required workflows

on: [pull_request, push]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx -y ts-node scripts/ci-guard/required-workflows/audit.ts
        env:
          AUDIT_SUMMARY_PATH: required-workflows-summary.md
      - run: node scripts/run-jest.js tests/ci-guard/required-workflows/audit.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: required-workflows
          path: required-workflows-summary.md
