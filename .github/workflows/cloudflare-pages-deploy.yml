name: Cloudflare Pages Deploy

on:
  push:
    branches: [00000production]
  workflow_dispatch:

env:
  BASH_ENV: scripts/env/aliases.sh

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
        continue-on-error: true
      - uses: ./.github/actions/js-stack-setup
        if: ${{ hashFiles('frontend/dist/**') == '' }}
      - name: Build frontend
        if: ${{ hashFiles('frontend/dist/**') == '' }}
        run: npm -w frontend ci && npm -w frontend run build
      - name: Ensure dist exists
        run: |
          if [ ! -d frontend/dist ]; then
            echo "::error::frontend/dist not found. Run cloudflare-pages-artifact workflow and ensure vite is installed"; exit 1;
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ env.CF_PAGES_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ env.CF_PAGES_PROJECT }}
