name: image asset pipeline

on:
  pull_request:
  push:
    branches:
      - dev
      - production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: install
        run: npm ci
      - name: run image pipeline tests
        run: node scripts/run-jest.js tests/assets
