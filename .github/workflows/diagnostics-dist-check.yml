name: diagnostics-dist-check

env:
  HUSKY: 0


on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    continue-on-error: true
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Print workspace structure
        run: |
          pwd
          ls -la
          find frontend -maxdepth 2 -type d -print
      - name: Assert dist index
        run: node scripts/ci/assert-dist.js
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: frontend/dist/
