name: Large File Guard

on:
  pull_request:

jobs:
  large-file-guard:
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - name: Run guard
        run: bash scripts/guard/large-file-guard.sh
