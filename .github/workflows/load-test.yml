name: Load Test

env:
  HUSKY: 0


on:
  workflow_dispatch:

concurrency:
  # Limit load tests to a single runner across all refs to avoid saturating runner capacity
  group: load-test
  cancel-in-progress: true

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            backend/dalle_server/package-lock.json
            pnpm-lock.yaml
      - run: echo "cache-hit: ${{ steps.setup-node.outputs.cache-hit }}"
      - run: npm install --no-audit --no-fund
      - run: npm run load -- -o artillery-report.json
      - name: Upload Artillery report
        uses: actions/upload-artifact@v4
        with:
          name: artillery-report
          path: artillery-report.json
