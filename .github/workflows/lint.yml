name: Lint

on:
  push:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      CI_NETWORK_OK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - name: Fetch repo assets from S3
        uses: ./.github/actions/fetch-repo-assets
        with:
          bucket: glb-models-prod
          region: eu-north-1
      - uses: ./.github/actions/fetch-repo-assets
        with:
          bucket: glb-models-prod
          region: eu-north-1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: mode
        run: |
          echo "Mode: ${{ env.CI_NO_NET == '1' && 'Offline' || 'Online' }}"
      - run: |
          if [ "$CI_NO_NET" = '1' ] || [ "$SKIP_PW_DEPS" = '1' ]; then
            npm ci --ignore-scripts --prefer-offline --no-audit --fund=false
          else
            npm ci
          fi
      - run: npm run build --if-present
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test
      - run: npm run lint
      - run: |
          if [ -d backend ]; then
            npm run lint --prefix backend
          fi
