name: Verify Lockfile

env:
  HUSKY: 0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 15
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      # Checkout the repository's code
      - uses: actions/checkout@v5
      - run: corepack enable

      # Cache npm dependencies for faster installs
      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: "${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}"
          restore-keys: |
            ${{ runner.os }}-npm-

      # Setup Node.js 20.x (>=16 required)
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies without auditing and without funding messages
      - run: npm ci --no-audit --no-fund

      # Regenerate the lockfile without modifying node_modules
      - run: npm install --package-lock-only

      # Fail if the regenerated lockfile differs from the committed one
      - name: Ensure lockfile is up to date
        run: |
          if ! git diff --quiet package-lock.json; then
            echo "::error::package-lock.json is out of sync. Please run 'npm install' and commit the updated lock file." >&2
            exit 1
          fi

  lockfile-diff:
    needs: verify
    if: ${{ needs.verify.result == 'failure' }}
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Show lockfile diff
        run: npx -y lockfile-diff HEAD package-lock.json
