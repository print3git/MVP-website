name: Pages Deploy

env:
  HUSKY: 0

on:
  push:
    branches: ["00000production"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 15
    name: Pages config validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build --prefix frontend
      - name: ban dist symlinks
        run: |
          if find frontend/dist -type l | grep -q .; then
            echo "Symlinks found in dist; replacing with copies";
            while IFS= read -r -d '' l; do
              tgt="$(readlink -f "$l")"; rm "$l"; cp -R "$tgt" "$l";
            done < <(find frontend/dist -type l -print0)
          fi
      - name: Validate config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler pages config validate --project-name "${{ secrets.CF_PAGES_PROJECT }}"

  deploy:
    timeout-minutes: 15
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm run build --prefix frontend
      - name: ban dist symlinks
        run: |
          if find frontend/dist -type l | grep -q .; then
            echo "Symlinks found in dist; replacing with copies";
            while IFS= read -r -d '' l; do
              tgt="$(readlink -f "$l")"; rm "$l"; cp -R "$tgt" "$l";
            done < <(find frontend/dist -type l -print0)
          fi
      - name: verify build
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "frontend/dist/index.html is missing"
            if command -v tree >/dev/null; then
              tree frontend/dist
            else
              find frontend/dist -maxdepth 2 -print
            fi
            exit 1
          fi
      - name: copy dist
        run: cp -a frontend/dist/. pages_dist/
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url=$(npx -y wrangler pages deploy pages_dist --project-name "${{ secrets.CF_PAGES_PROJECT }}" --branch production | tee /tmp/deploy.log | grep -Eo 'https://[^ ]+\.pages\.dev' | tail -n 1)
          echo "$url" > deploy-url.txt
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: steps.deploy.outputs.url
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.deploy.outputs.url
        with:
          name: pages-deploy-url
          path: deploy-url.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-dist
          path: pages_dist
          if-no-files-found: ignore
