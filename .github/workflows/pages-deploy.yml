name: Pages Deploy

on:
  push:
    branches: ["00000production"]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: hashFiles('frontend/package.json') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm run build --prefix frontend
      - name: verify build
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "frontend/dist/index.html is missing"
            if command -v tree >/dev/null; then
              tree frontend/dist
            else
              find frontend/dist -maxdepth 2 -print
            fi
            exit 1
          fi
      - name: sanitize symlinks
        run: |
          find frontend/dist -type l -exec bash -c 't=$(mktemp); cp -L "{}" "$t" && mv "$t" "{}"' \;
          find frontend/dist -type l -exec rm -f {} +
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url=$(npx -y wrangler pages deploy frontend/dist --project-name "${{ secrets.CF_PAGES_PROJECT }}" --branch production | tee /tmp/deploy.log | grep -Eo 'https://[^ ]+' | tail -n 1)
          echo "$url" > deploy-url.txt
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: steps.deploy.outputs.url
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.deploy.outputs.url
        with:
          name: pages-deploy-url
          path: deploy-url.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
