name: Pages Deploy

env:
  HUSKY: 0

on:
  push:
    branches: ["00000production"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 15
    name: Pages config validate
    runs-on:
      - [self-hosted, linux, aws, small]
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: ./.github/actions/js-stack-setup
      - run: pnpm install --no-frozen-lockfile
        working-directory: frontend
      - run: pnpm -C frontend build
      - name: Validate config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler pages config validate --project-name "${{ secrets.CF_PAGES_PROJECT }}"

  deploy:
    timeout-minutes: 15
    needs: validate
    runs-on:
      - [self-hosted, linux, aws, small]
      - ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: ./.github/actions/js-stack-setup
      - run: pnpm install --no-frozen-lockfile
        working-directory: frontend
      - run: pnpm -C frontend build
      - run: test -f frontend/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url=$(npx -y wrangler pages deploy frontend/dist --project-name "${{ secrets.CF_PAGES_PROJECT }}" --branch production | tee /tmp/deploy.log | grep -Eo 'https://[^ ]+\.pages\.dev' | tail -n 1)
          echo "$url" > deploy-url.txt
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: steps.deploy.outputs.url
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.deploy.outputs.url
        with:
          name: pages-deploy-url
          path: deploy-url.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
