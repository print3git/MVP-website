name: ESLint Diagnostics

env:
  HUSKY: 0


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    timeout-minutes: 15
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    continue-on-error: true
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - name: Lint root
        id: lint-root
        run: |
          npm run check-conflicts
          npx eslint 'scripts/**/*.js' --max-warnings=0 --no-warn-ignored
        continue-on-error: true
      - name: Lint backend
        id: lint-backend
        run: npm run lint --prefix backend -- --ignore-pattern lib
        continue-on-error: true
      - name: Generate ESLint report
        if: steps.lint-root.outcome == 'failure' || steps.lint-backend.outcome == 'failure'
        run: npx eslint 'scripts/**/*.js' backend --ignore-pattern backend/lib -f json -o eslint-results.json || true
      - name: Upload ESLint results
        if: steps.lint-root.outcome == 'failure' || steps.lint-backend.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-results
          path: eslint-results.json
