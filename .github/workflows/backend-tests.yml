name: Backend Tests

on:
  pull_request:
  push:
    branches:
      - 00000production

jobs:
  probe_runner:
    uses: ./.github/workflows/_runner-probe.yml

  provision:
    needs: [probe_runner]
    uses: ./.github/workflows/aws-ec2-runner.yml
    secrets: inherit

  tests:
    needs: [probe_runner, provision]
    runs-on: ${{ fromJSON(steps.resolve.outputs.value) }}
    steps:
      - name: Resolve runner choice
        id: resolve
        uses: ./.github/actions/resolve-runs-on
        with:
          online: ${{ needs.probe_runner.outputs.online }}
      - uses: actions/checkout@v4.1.6
      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  fastlane:
    needs: [probe_runner]
    uses: ./.github/workflows/_aws-fastlane.yml
    secrets: inherit
    with:
      matrix: |
        shard: [aa, ab, ac]
      script: |
        npm ci
        npm ci --prefix backend
        node scripts/run-jest.js backend --listTests | split -n l/3 - test-files-
        TEST_FILES=$(cat test-files-${{ matrix.shard }} | tr '\n' ' ')
        node scripts/run-jest.js --runTestsByPath $TEST_FILES --ci --coverage

  fallback:
    needs: [probe_runner]
    if: failure()
    runs-on: ${{ fromJSON(steps.resolve.outputs.value) }}
    strategy:
      matrix:
        shard: [aa, ab, ac]
    steps:
      - name: Resolve runner choice
        id: resolve
        uses: ./.github/actions/resolve-runs-on
        with:
          online: ${{ needs.probe_runner.outputs.online }}
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm ci --prefix backend
      - run: |
          node scripts/run-jest.js backend --listTests | split -n l/3 - test-files-
          TEST_FILES=$(cat test-files-${{ matrix.shard }} | tr '\n' ' ')
          node scripts/run-jest.js --runTestsByPath $TEST_FILES --ci --coverage
