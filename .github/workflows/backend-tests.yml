name: Backend Tests

on:
  pull_request:
  push:
    branches:
      - 00000production

jobs:
  provision:
    uses: ./.github/workflows/aws-ec2-runner.yml
    secrets: inherit

  tests:
    needs: provision
    runs-on: [self-hosted, linux, aws-ec2]
    steps:
      - uses: actions/checkout@v4.1.6
      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
  fastlane:
    uses: ./.github/workflows/_aws-fastlane.yml
    secrets: inherit
    with:
      matrix: |
        shard: [aa, ab, ac]
      script: |
        npm ci
        npm ci --prefix backend
        node scripts/run-jest.js backend --listTests | split -n l/3 - test-files-
        TEST_FILES=$(cat test-files-${{ matrix.shard }} | tr '\n' ' ')
        node scripts/run-jest.js --runTestsByPath $TEST_FILES --ci --coverage

  fallback:
    if: failure()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [aa, ab, ac]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm ci --prefix backend
      - run: |
          node scripts/run-jest.js backend --listTests | split -n l/3 - test-files-
          TEST_FILES=$(cat test-files-${{ matrix.shard }} | tr '\n' ' ')
          node scripts/run-jest.js --runTestsByPath $TEST_FILES --ci --coverage
