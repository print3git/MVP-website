name: Backend Tests

env:
  HUSKY: 0

on:
  pull_request:
  push:
    branches:
      - 00000production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-tests:
    if: github.event_name == 'pull_request'
    runs-on:
      - [self-hosted, linux, aws, small]
      - ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Run changed tests
        run: |
          corepack enable
          pnpm i --frozen-lockfile --ignore-scripts
          pnpm jest --ci --runInBand --reporters=default \
            --silent --noStackTrace \
            --changedSince=origin/00000production \
            --passWithNoTests

  full-suite:
    if: github.ref_name == '00000production'
    runs-on:
      - [self-hosted, linux, aws, small]
      - ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [ aa, ab, ac ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install root dependencies
        run: |
          for attempt in 1 2; do
            if npm ci; then
              break
            elif [ $attempt -eq 2 ]; then
              exit 1
            else
              sleep $((2**attempt))
            fi
          done
      - name: Install backend dependencies
        run: |
          for attempt in 1 2; do
            if npm ci --prefix backend; then
              break
            elif [ $attempt -eq 2 ]; then
              exit 1
            else
              sleep $((2**attempt))
            fi
          done
      - name: Run backend tests
        run: |
          node scripts/run-jest.js backend --listTests | split -n l/3 - test-files-
          TEST_FILES=$(cat test-files-${{ matrix.shard }} | tr '\n' ' ')
          node scripts/run-jest.js --runTestsByPath $TEST_FILES --ci --coverage
    timeout-minutes: 15
