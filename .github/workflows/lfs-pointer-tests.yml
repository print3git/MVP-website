name: LFS Pointer Tests
on: [pull_request, push]
jobs:
  lfs-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || pnpm install || yarn install
      - run: npm run test:lfs
