name: Playwright E2E (with deps)
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      CI_NETWORK_OK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: mode
        run: |
          echo "Mode: ${{ env.CI_NO_NET == '1' && 'Offline' || 'Online' }}"
      - name: Install deps
        run: |
          if [ "$CI_NO_NET" = '1' ] || [ "$SKIP_PW_DEPS" = '1' ]; then
            npm ci --ignore-scripts --prefer-offline --no-audit --fund=false
          else
            npm ci
          fi
      - name: Install Playwright browsers + OS dependencies
        run: |
          npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          nohup npm run start:ci > /tmp/app.log 2>&1 &
          if ! npx wait-on http://localhost:3000 --timeout 180000; then
            cat /tmp/app.log
            exit 1
          fi
      - name: Run model-loading tests
        env:
          CI: "true"
        run: |
          npx playwright test --trace on tests/e2e/model-loading.spec.ts
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
