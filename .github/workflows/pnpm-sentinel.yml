name: pnpm sentinel

on:
  push:
    branches:
      - dev
      - 00000production
  pull_request:
    branches:
      - dev
      - 00000production

jobs:
  sentinel:
    runs-on: [self-hosted, linux, x64, ci-small]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pnpm
        uses: ./.github/actions/ensure-pnpm
