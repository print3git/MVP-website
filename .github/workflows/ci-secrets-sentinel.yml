name: CI Secrets Sentinel

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: [self-hosted, linux, x64, ci-small]
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        id: scan
        uses: ./.github/actions/secret-sentinel
        with:
          vars: |
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_REGION
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            CF_ACCOUNT_ID
            CF_PAGES_API_TOKEN
            CF_PAGES_PROJECT
            CLOUDFRONT_MODEL_DOMAIN
            DB_URL
            DISCORD_WEBHOOK_URL
            HF_API_KEY
            HF_TOKEN
            HF_WRITE_TOKEN
            NETLIFY_AUTH_TOKEN
            NETLIFY_SITE_ID
            S3_BUCKET
            SLACK_WEBHOOK
            SLACK_WEBHOOK_URL
            SPARC3D_ENDPOINT
            SPARC3D_TOKEN
            STABILITY_KEY
            STRIPE_SECRET_KEY
            STRIPE_TEST_KEY
            STRIPE_WEBHOOK_SECRET
            COVERALLS_REPO_TOKEN
            SNYK_TOKEN
      - name: Summary
        run: |
          echo "Missing secrets: ${{ steps.scan.outputs.missing }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.scan.outputs.missing }}" != "[]" ]; then
            echo "::warning::Some suites are gated on these secrets. Re-run with write permissions or trigger workflow_dispatch on a branch."
          else
            echo "All secrets present." >> "$GITHUB_STEP_SUMMARY"
          fi
