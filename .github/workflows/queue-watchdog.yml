name: Queue Watchdog

on:
  workflow_run:
    workflows: ["CI Full Suite (compat)", "CI Auditor", "Full CI Aggregate / safety", "CI Sanity Guard / sanity"]
    types: [requested]

jobs:
  watchdog:
    runs-on: [self-hosted, linux, x64, ci-small]
    continue-on-error: true
    steps:
      - uses: print3d/queue-watchdog@v0
