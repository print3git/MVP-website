name: CI SLO Watchdog
on:
  schedule:
    - cron: '0 * * * *'
  workflow_call:
    inputs:
      min_samples:
        type: number
        default: 10
      window_minutes:
        type: number
        default: 120
      cooldown_minutes:
        type: number
        default: 180
permissions:
  actions: read
  issues: write
jobs:
  watchdog:
    runs-on: ubuntu-latest
    outputs:
      start_rate: ${{ steps.eval.outputs.start_rate }}
      total_jobs: ${{ steps.eval.outputs.total_jobs }}
      min_samples: ${{ steps.eval.outputs.min_samples }}
      summary: ${{ steps.eval.outputs.summary }}
      comment: ${{ steps.eval.outputs.comment }}
    steps:
      - name: Evaluate SLO
        id: eval
        uses: actions/github-script@v7
        with:
          script: |
            const minSamples = parseInt(core.getInput('min_samples') || '10', 10);
            const windowMinutes = parseInt(core.getInput('window_minutes') || '120', 10);
            const since = Date.now() - windowMinutes * 60 * 1000;
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const recent = artifacts.filter(a => a.name === 'ci-metrics' && new Date(a.created_at).getTime() >= since);
            let queued = 0, started = 0;
            const perJob = {};
            for (const art of recent) {
              const zip = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id: art.id, archive_format: 'zip' });
              const buf = Buffer.from(zip.data);
              const zlib = require('node:zlib');
              const lines = zlib.unzipSync(buf).toString('utf8').trim().split(/\n/);
              for (const line of lines) {
                const m = JSON.parse(line);
                if (m.MetricName === 'QueuedJobs') queued += m.Value;
                if (m.MetricName === 'StartedJobs') started += m.Value;
                if (m.JobName) {
                  perJob[m.JobName] ||= { queued: 0, started: 0 };
                  if (m.MetricName === 'QueuedJobs') perJob[m.JobName].queued += m.Value;
                  if (m.MetricName === 'StartedJobs') perJob[m.JobName].started += m.Value;
                }
              }
            }
            const startRate = queued ? (started / queued * 100) : 0;
            const summary = `start rate ${startRate.toFixed(1)}%`;
            const counts = Object.entries(perJob).map(([n,v])=>`${n}: ${v.started}/${v.queued}`).join('\n');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, { owner, repo, status: 'queued', per_page: 100 });
            const queuedJobs = [];
            for (const run of runs) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: run.id });
              for (const job of jobs) {
                if (job.status === 'queued') queuedJobs.push(`${job.name} (${job.labels.join(',')})`);
              }
            }
            const topQueued = queuedJobs.slice(0, 10).map(j => `- ${j}`).join('\n');
            let runnerInfo = '';
            try {
              const self = await github.rest.actions.listRunnersForRepo({ owner, repo });
              runnerInfo += `self-hosted: ${self.data.total_count}`;
            } catch (e) {
              runnerInfo += 'self-hosted: n/a';
            }
            try {
              await github.rest.actions.getActionsCacheUsageByRepository({ owner, repo });
              runnerInfo += '\ngithub-hosted: accessible';
            } catch (e) {
              runnerInfo += '\ngithub-hosted: n/a';
            }
            const comment = `Queued vs started by job:\n${counts}\n\nTop queued checks:\n${topQueued}\n\nRunner availability:\n${runnerInfo}`;
            core.setOutput('start_rate', startRate.toFixed(2));
            core.setOutput('total_jobs', queued.toString());
            core.setOutput('min_samples', minSamples.toString());
            core.setOutput('summary', summary);
            core.setOutput('comment', comment);
      - name: Guard issue
        if: >
          fromJSON(steps.eval.outputs.start_rate) < 95 &&
          fromJSON(steps.eval.outputs.total_jobs) >= fromJSON(steps.eval.outputs.min_samples) &&
          (github.ref_name == 'dev' || github.ref_name == '00000production')
        uses: ./.github/actions/ci-slo-guard
        with:
          start_rate: ${{ steps.eval.outputs.start_rate }}
          summary: ${{ steps.eval.outputs.summary }}
          comment: ${{ steps.eval.outputs.comment }}
          cooldown_minutes: ${{ inputs.cooldown_minutes }}
  slo-diag:
    runs-on: ubuntu-latest
    needs: watchdog
    if: needs.watchdog.outputs.start_rate && fromJSON(needs.watchdog.outputs.start_rate) < 95
    steps:
      - name: Collect diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id });
            const group = jobs.reduce((acc, j) => {
              acc[j.status] = (acc[j.status] || 0) + 1;
              if (!j.labels || j.labels.length === 0) core.warning(`Job ${j.name} has label mismatch`);
              if (j.workflow_name && j.workflow_name.includes('reusable') && context.eventName !== 'workflow_call') core.warning(`Reusable workflow ${j.name} missing workflow_call`);
              return acc;
            }, {});
            const fs = require('fs');
            fs.mkdirSync('ci', { recursive: true });
            fs.writeFileSync('ci/slo-diagnostics.json', JSON.stringify({ summary: group }, null, 2));
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ci-slo-diagnostics
          path: ci/slo-diagnostics.json
