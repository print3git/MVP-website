name: guard-single-lockfile-policy

on: [pull_request, push]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
          cache: pnpm
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 10.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec ts-node scripts/ci-guard/single-lockfile-policy/audit.ts
      - run: pnpm test tests/ci-guard/single-lockfile-policy/audit.test.ts
