name: "CI: pnpm guard"
on:
  pull_request:
    paths:
      - ".github/workflows/**/*.yml"
      - "scripts/ci-guards/**"
      - "tests/ci-guards/**"
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
      - run: npm ci || npm i
      - run: node scripts/ci-guards/check-pnpm-usage.js
      - run: npm test -- --reporters=default
