name: guard-secret-sentinel

on: [pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm test -- tests/ci-guard/secret-sentinel/audit.test.ts
