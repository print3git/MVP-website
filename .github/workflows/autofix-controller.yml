name: Autofix Controller

on:
  workflow_run:
    workflows: ["CI Full Lane", "CI", "Build", "Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        required: false
        type: string

jobs:
  collect:
    permissions:
      contents: read
      actions: read
      artifacts: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
      - run: npm ci || npm i
      - name: Harvest logs -> ci/autofix/inbox/*.json
        run: node scripts/autofix/harvest.js
      - name: Parse & cluster errors
        run: node scripts/autofix/cluster.js
      - uses: actions/upload-artifact@v4.3.1
        with:
          name: autofix-inbox
          path: ci/autofix/inbox
