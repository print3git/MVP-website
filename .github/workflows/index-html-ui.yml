name: index.html UI - test suite

on:
  push:
    branches: [dev, "00000production"]
  pull_request:
    branches: [dev, "00000production"]

jobs:
  index-html-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run index.html UI tests
        run: npx playwright test tests/e2e/index-ui.spec.*.ts
