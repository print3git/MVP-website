name: Deploy

env:
  HUSKY: 0


on:
  workflow_run:
    workflows: ["CI"]
    branches: [00000production]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 15
    if: vars.ENABLE_PAGES == '1' && github.event.workflow_run.conclusion == 'success'
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    env:
      WRANGLER_VERSION: 3.72.0

    steps:

      - name: Heartbeat

        run: |

          while true; do date; sleep 120; done &
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Check infrastructure drift
        id: terraform-plan
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform init -input=false
          terraform plan -no-color > plan.txt
          if grep -q 'No changes' plan.txt; then
            echo "No drift detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Terraform Drift Detected" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            cat plan.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "[Re-apply](https://github.com/${{ github.repository }}/actions/workflows/deploy.yml)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/install-deps

      - name: Mask secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Build frontend
        working-directory: frontend
        run: npm run build:ci

      - name: Verify dist output
        run: node scripts/assert-frontend-dist.js

      - name: Ensure dist contains no LFS pointers
        run: |
          git lfs install
          if grep -RIl "https://git-lfs.github.com/spec/v1" frontend/dist; then
            echo "Git LFS pointers found in build output. Commit real assets or host them externally."
            exit 1
          fi

      - name: Copy dist without symlinks
        run: cp -aL frontend/dist/. pages_dist/

      - name: Assert Pages project has no build config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@${{ env.WRANGLER_VERSION }} --version
          info=$(npx wrangler@${{ env.WRANGLER_VERSION }} pages project info mvp-website --output json)
          build_command=$(echo "$info" | jq -r '.deployment_configs.production.build_config.build_command')
          root_dir=$(echo "$info" | jq -r '.deployment_configs.production.build_config.root_dir')
          if [ "$build_command" != "null" ] && [ -n "$build_command" ]; then
            echo "Pages-side build command configured: $build_command"
            exit 1
          fi
          if [ "$root_dir" != "null" ] && [ -n "$root_dir" ]; then
            echo "Pages-side root_dir configured: $root_dir"
            exit 1
          fi

      - name: Deploy with Wrangler
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@${{ env.WRANGLER_VERSION }} --version
          set +e
          for attempt in 1 2 3; do
            echo "Attempt $attempt"
            npx wrangler@${{ env.WRANGLER_VERSION }} pages deploy pages_dist --project-name mvp-website 2>&1 | tee deploy.log
            status=${PIPESTATUS[0]}
            if [ $status -eq 0 ]; then
              break
            fi
            if grep -q "5[0-9][0-9]" deploy.log && [ $attempt -lt 3 ]; then
              echo "5xx error detected, retrying..."
              sleep 5
            else
              exit $status
            fi
          done
          url=$(grep -o 'https://[^ ]*' deploy.log | tail -n1)
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "$url" > pages-url.txt

      - name: Upload Pages URL
        if: steps.deploy.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: pages-url
          path: pages-url.txt

      - name: Publish to Cloudflare Pages
        run: |
          npx wrangler@${{ env.WRANGLER_VERSION }} --version
          npx wrangler@${{ env.WRANGLER_VERSION }} pages deploy pages_dist --project-name ${{ secrets.CF_PAGES_PROJECT }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}

  pages-disabled:
    timeout-minutes: 15
    if: vars.ENABLE_PAGES != '1' && github.event.workflow_run.conclusion == 'success'
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - run: echo "Pages deploy is disabled for PRs; enable via repo variable."
