name: Deploy

on:
  push:
    branches: [00000production]

jobs:
  deploy:
    if: vars.ENABLE_PAGES == '1'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: npm ci && npm run build:frontend

      - name: Run deployment readiness test
        run: npm run test:cf-readiness

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          projectName: ${{ secrets.CF_PAGES_PROJECT }}
          accountId:   ${{ secrets.CF_ACCOUNT_ID }}
          apiToken:    ${{ secrets.CF_PAGES_API_TOKEN }}
          directory:   ./frontend/dist
          wranglerVersion: '3'

  pages-disabled:
    if: vars.ENABLE_PAGES != '1'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pages deploy is disabled for PRs; enable via repo variable."
