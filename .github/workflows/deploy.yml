name: Deploy

on:
  push:
    branches: [00000production]

jobs:
  deploy:
    if: vars.ENABLE_PAGES == '1'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Assert build output
        run: node scripts/assert-dist.mjs

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy frontend/dist --project-name mvp-website

  pages-disabled:
    if: vars.ENABLE_PAGES != '1'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pages deploy is disabled for PRs; enable via repo variable."
