name: Deploy

on:
  push:
    branches: [00000production]

jobs:
  deploy:
    if: vars.ENABLE_PAGES == '1'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify build output
        run: ls -al frontend/dist && test -f frontend/dist/index.html

      - name: Run deployment readiness test
        run: npm run test:cf-readiness

      - name: Assert frontend artifact
        run: node scripts/assert-frontend-dist.js

      - name: Publish to Cloudflare Pages
        run: npx wrangler@3 pages deploy frontend/dist --project-name ${{ secrets.CF_PAGES_PROJECT }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}

  pages-disabled:
    if: vars.ENABLE_PAGES != '1'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pages deploy is disabled for PRs; enable via repo variable."
