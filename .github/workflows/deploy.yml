name: Deploy

on:
  push:
    branches: [00000production]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.ENABLE_PAGES == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Start heartbeat
        run: |
          while true; do
            echo "heartbeat"
            sleep 300
          done &
          echo $! > heartbeat.pid
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Mask secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Build frontend
        working-directory: frontend
        run: npm run build:ci

      - name: Assert dist exists
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "frontend/dist/index.html missing after build" >&2
            exit 1
          fi

      - name: Assert Pages project has no build config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          info=$(npx wrangler pages project info mvp-website --output json)
          build_command=$(echo "$info" | jq -r '.deployment_configs.production.build_config.build_command')
          root_dir=$(echo "$info" | jq -r '.deployment_configs.production.build_config.root_dir')
          if [ "$build_command" != "null" ] && [ -n "$build_command" ]; then
            echo "Pages-side build command configured: $build_command"
            exit 1
          fi
          if [ "$root_dir" != "null" ] && [ -n "$root_dir" ]; then
            echo "Pages-side root_dir configured: $root_dir"
            exit 1
          fi

      - name: Deploy with Wrangler
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Attempt $attempt"
            npx wrangler pages deploy frontend/dist --project-name mvp-website 2>&1 | tee deploy.log
            status=${PIPESTATUS[0]}
            if [ $status -eq 0 ]; then
              break
            fi
            if grep -q "5[0-9][0-9]" deploy.log && [ $attempt -lt 3 ]; then
              echo "5xx error detected, retrying..."
              sleep 5
            else
              exit $status
            fi
          done
          url=$(grep -o 'https://[^ ]*' deploy.log | tail -n1)
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "$url" > pages-url.txt

      - name: Upload Pages URL
        if: steps.deploy.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: pages-url
          path: pages-url.txt

      - name: Assert frontend artifact
        run: node scripts/assert-frontend-dist.js

      - name: Publish to Cloudflare Pages
        run: npx wrangler@3 pages deploy frontend/dist --project-name ${{ secrets.CF_PAGES_PROJECT }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}

      - name: Stop heartbeat
        if: always()
        run: kill $(cat heartbeat.pid) || true

  pages-disabled:
    if: vars.ENABLE_PAGES != '1'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pages deploy is disabled for PRs; enable via repo variable."
