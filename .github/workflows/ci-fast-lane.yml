name: CI Fast Lane
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.map.outputs.backend }}
      frontend: ${{ steps.map.outputs.frontend }}
      e2e: ${{ steps.map.outputs.e2e }}
      docs: ${{ steps.map.outputs.docs }}
      infra: ${{ steps.map.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - id: map
        uses: ./.github/actions/ci-impact-map
  lint:
    uses: ./.github/workflows/reusable-test-job.yml
    needs: impact
    with:
      suite: lint
      command: npm run lint
  typecheck:
    uses: ./.github/workflows/reusable-test-job.yml
    needs: impact
    with:
      suite: typecheck
      command: npm run typecheck
  unit:
    uses: ./.github/workflows/reusable-test-job.yml
    needs: impact
    with:
      suite: unit
      command: JEST_RETRIES=2 npm test -- --config scripts/ci/jest.config.ci.ts
  backend:
    if: needs.impact.outputs.backend == 'true'
    uses: ./.github/workflows/reusable-test-job.yml
    needs: impact
    with:
      suite: backend
      command: npm test -- --backend
  frontend:
    if: needs.impact.outputs.frontend == 'true'
    uses: ./.github/workflows/reusable-test-job.yml
    needs: impact
    with:
      suite: frontend
      command: npm test -- --frontend
  e2e:
    if: needs.impact.outputs.e2e == 'true'
    uses: ./.github/workflows/reusable-test-job.yml
    needs: impact
    with:
      suite: e2e
      command: npm run test:e2e
  docs:
    if: needs.impact.outputs.docs == 'true'
    uses: ./.github/workflows/reusable-test-job.yml
    needs: impact
    with:
      suite: docs
      command: npm test -- --docs
  infra:
    if: needs.impact.outputs.infra == 'true'
    uses: ./.github/workflows/reusable-test-job.yml
    needs: impact
    with:
      suite: infra
      command: npm test -- --infra
  inventory:
    needs: impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - name: Guard inventory scripts exist
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); const s=p.scripts||{}; if(!('gen:test-inventory' in s || 'gen:test-inventory:ci' in s)){console.error('Missing gen:test-inventory script'); process.exit(2)} if(!('test:inventory' in s)){console.error('Missing test:inventory script'); process.exit(2)}"
      - shell: bash
        run: |
          set -euo pipefail
          npm run gen:test-inventory || npm run gen:test-inventory:ci || true
          npm run test:inventory
