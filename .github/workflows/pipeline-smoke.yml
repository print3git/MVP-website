name: Full Pipeline Smoke Test

env:
  HUSKY: 0

on:
  push:
    branches:
      - dev
      - 00000production
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    timeout-minutes: 15
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      # >>> BEGIN MANAGED BLOCK: ci-guard:frontend-smoke-artifact
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable
        shell: bash
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - name: Install deps (frontend)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
        shell: bash
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build
        shell: bash
      - name: Verify build artifact
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html || { echo "::error::frontend/dist/index.html missing"; exit 2; }
        shell: bash
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      # <<< END MANAGED BLOCK: ci-guard:frontend-smoke-artifact

  smoke_test:
    timeout-minutes: 15
    needs: frontend-build
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    env:
      STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
      DB_URL: ${{ secrets.DB_URL }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      CLOUDFRONT_MODEL_DOMAIN: ${{ secrets.CLOUDFRONT_MODEL_DOMAIN }}
      SPARC3D_ENDPOINT: ${{ secrets.SPARC3D_ENDPOINT }}
      SPARC3D_TOKEN: ${{ secrets.SPARC3D_TOKEN }}
      STABILITY_KEY: ${{ secrets.STABILITY_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PORT: 3000
      CI_REQUIRE_EXTERNAL: "0"
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: Checkout code
        uses: actions/checkout@v5
      # >>> BEGIN MANAGED BLOCK: ci-guard:frontend-smoke-artifact
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Re-verify artifact
        run: test -f frontend/dist/index.html
        shell: bash
      # <<< END MANAGED BLOCK: ci-guard:frontend-smoke-artifact

      - name: Load Stripe env
        run: node scripts/ci-env-preflight.js
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run smoke

      - name: Start backend
        run: npm run dev &
        shell: bash

      - name: Wait for backend
        run: npx wait-on http://localhost:3000 --timeout 300000

      - name: Test generate endpoint
        run: npm run test:generate
      - name: Test Stripe webhook
        if: env.CI_REQUIRE_EXTERNAL == '1'
        run: npm run test:webhook

      - name: Stop backend
        run: pkill -f "node backend/server.js" || true

      - name: Run diagnostics
        run: npm run diagnose

      - name: Collect logs
        if: always()
        run: |
          tail -n 200 /tmp/server.log > /tmp/server-tail.log || true

      - name: Upload diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            /tmp/diagnostics.log
            /tmp/server-tail.log
