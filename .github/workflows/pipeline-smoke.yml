name: Full Pipeline Smoke Test

env:
  HUSKY: 0

on:
  push:
    branches:
      - dev
      - 00000production
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: [self-hosted, linux, aws]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: test -f frontend/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  smoke_test:
    needs: build-frontend
    timeout-minutes: 15
    runs-on: [self-hosted, linux, aws]
    env:
      STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
      DB_URL: ${{ secrets.DB_URL }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      CLOUDFRONT_MODEL_DOMAIN: ${{ secrets.CLOUDFRONT_MODEL_DOMAIN }}
      SPARC3D_ENDPOINT: ${{ secrets.SPARC3D_ENDPOINT }}
      SPARC3D_TOKEN: ${{ secrets.SPARC3D_TOKEN }}
      STABILITY_KEY: ${{ secrets.STABILITY_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PORT: 3000
      CI_REQUIRE_EXTERNAL: "0"
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Load Stripe env
        run: node scripts/ci-env-preflight.js
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: test -f frontend/dist/index.html

      - name: Run smoke tests
        run: npm run smoke

      - name: Start backend
        run: npm run dev &
        shell: bash

      - name: Wait for backend
        run: npx wait-on http://localhost:3000 --timeout 300000

      - name: Test generate endpoint
        run: npm run test:generate
      - name: Test Stripe webhook
        if: env.CI_REQUIRE_EXTERNAL == '1'
        run: npm run test:webhook

      - name: Stop backend
        run: pkill -f "node backend/server.js" || true

      - name: Run diagnostics
        run: npm run diagnose

      - name: Collect logs
        if: always()
        run: |
          tail -n 200 /tmp/server.log > /tmp/server-tail.log || true

      - name: Upload diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            /tmp/diagnostics.log
            /tmp/server-tail.log
