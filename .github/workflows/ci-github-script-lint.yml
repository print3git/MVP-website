name: "CI: github-script lint suite"
on:
  pull_request:
    paths:
      - ".github/workflows/**/*.yml"
      - "scripts/ci-guards/**"
      - "tests/ci-guards/**"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: node scripts/ci-guards/analyze-github-script.js
      - run: npm test -- --reporters=default
      - uses: actions/upload-artifact@v4
        with:
          name: github-script-report
          path: ci/guards/github-script-report.json
