name: Binary & LFS Change Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  push:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base and head
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            # For a push, diff against the merge-base with default branch
            git fetch origin "${{ github.event.repository.default_branch }}":"refs/remotes/origin/${{ github.event.repository.default_branch }}"
            base=$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}")
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "head=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan for binary and LFS-tracked changes
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.refs.outputs.base }}"
          head="${{ steps.refs.outputs.head }}"

          echo "Diff: $base..$head"

          # List changed files (added/modified)
          git diff --name-only --diff-filter=AM "$base" "$head" > changed.txt || true
          echo "Changed files:"
          cat changed.txt || true

          # Files Git classifies as binary in this diff
          git diff --numstat "$base" "$head" | awk '$1=="-" && $2=="-" {print $3}' > binaries.txt || true

          # Files that are LFS-tracked (per .gitattributes) among the changed set
          : > lfs_changed.txt
          if [ -s changed.txt ]; then
            git check-attr -a --stdin < changed.txt | awk '
              /^.*: filter: lfs$/ { print prev }
              { prev=$1 }
            ' | sed 's/:$//' | sort -u > lfs_changed.txt || true
          fi

          # Offenders = (binaries in diff) ∪ (LFS-tracked files changed)
          sort -u binaries.txt lfs_changed.txt > offending.txt || true

          echo "Binary-in-diff:"
          cat binaries.txt || true
          echo "LFS-changed:"
          cat lfs_changed.txt || true
          echo "Offending:"
          cat offending.txt || true

          offenders=$(wc -l < offending.txt | tr -d ' ')
          echo "offenders=$offenders" >> "$GITHUB_OUTPUT"

          if [ "$offenders" -gt 0 ]; then
            echo "::error::Binary/LFS files changed:\n$(cat offending.txt)"
            exit 1
          fi

      - name: Comment summary (PRs only)
        if: ${{ github.event_name == 'pull_request' && steps.scan.outputs.offenders != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('offending.txt', 'utf8').trim();
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⛔️ Binary/LFS files changed:\n\n\`\`\`\n${body}\n\`\`\`\nPlease move these to an external store or avoid modifying them in this PR.`
            });
