name: Binary & LFS Change Guard

on:
  pull_request:
    branches: [dev, 00000production, "**"]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # we need history to diff/merge-base

      - name: Determine base and head
        id: revs
        shell: bash
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          HEAD_SHA="${{ github.sha }}"

          if [[ "$EVENT" == "pull_request" ]]; then
            TARGET_REF="${{ github.event.pull_request.base.ref }}"
            TARGET_SHA="${{ github.event.pull_request.base.sha }}"
            # Fetch the PR base branch to compute a real merge-base
            git fetch --no-tags --prune origin "$TARGET_REF":"origin/$TARGET_REF"
            BASE_SHA="$(git merge-base "$HEAD_SHA" "origin/$TARGET_REF")"
          else
            # push to dev
            TARGET_REF="dev"
            BEFORE="${{ github.event.before }}"
            # Best-effort: fetch dev and compute merge-base
            git fetch --no-tags --prune origin "$TARGET_REF":"origin/$TARGET_REF" || true
            BASE_SHA="$BEFORE"
            # Fallbacks if BEFORE is empty or equals HEAD
            if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" == "$HEAD_SHA" ]]; then
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                BASE_SHA="$(git rev-parse HEAD^)"
              elif git rev-parse "origin/$TARGET_REF" >/dev/null 2>&1; then
                BASE_SHA="$(git merge-base "$HEAD_SHA" "origin/$TARGET_REF")"
              else
                # last resort: compare the commit to itself to avoid crashing
                BASE_SHA="$HEAD_SHA"
              fi
            fi
          fi

          echo "base=$BASE_SHA"   >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA"   >> "$GITHUB_OUTPUT"
          echo "target=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "Using diff: $BASE_SHA..$HEAD_SHA"

      - name: Scan for binary and LFS-tracked changes
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.revs.outputs.base }}"
          HEAD="${{ steps.revs.outputs.head }}"
          echo "Diff: $BASE..$HEAD"

          # List changed files (added/modified)
          git diff --name-only --diff-filter=AM "$BASE" "$HEAD" > changed.txt || true
          echo "Changed files:"; cat changed.txt || true

          # Files Git classifies as binary in this diff
          git diff --numstat "$BASE" "$HEAD" | awk '$1=="-" && $2=="-" {print $3}' > binaries.txt || true

          # Files that are LFS-tracked (per .gitattributes) among the changed set
          : > lfs_changed.txt
          if [ -s changed.txt ]; then
            git check-attr -a --stdin < changed.txt | awk '
              /^.*: filter: lfs$/ { print prev }
              { prev=$1 }
            ' | sed 's/:$//' | sort -u > lfs_changed.txt || true
          fi

          # Offenders = (binaries in diff) ∪ (LFS-tracked files changed)
          sort -u binaries.txt lfs_changed.txt > offending.txt || true

          echo "Binary-in-diff:"; cat binaries.txt || true
          echo "LFS-changed:";    cat lfs_changed.txt || true
          echo "Offending:";      cat offending.txt || true

          offenders=$(wc -l < offending.txt | tr -d ' ')
          echo "offenders=$offenders" >> "$GITHUB_OUTPUT"
          if [ "$offenders" -gt 0 ]; then
            echo "::error::Binary/LFS files changed:\n$(cat offending.txt)"
            exit 1
          fi

      - name: Comment summary (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const offenders = Number(core.getInput('offenders'));
            const body = offenders === 0
              ? "✅ Binary & LFS Guard: **no binary/LFS file changes detected**."
              : `❌ Binary & LFS Guard: ${offenders} offender(s). See job logs.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
        env:
          offenders: ${{ steps.scan.outputs.offenders }}
