name: Server Smoke Test

env:
  HUSKY: 0

on:
  push:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    timeout-minutes: 15
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            frontend:
              - 'frontend/**'

  frontend-build:
    timeout-minutes: 15
    needs: changes
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v4
      # >>> BEGIN MANAGED BLOCK: ci-guard:frontend-smoke-artifact
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable
        shell: bash
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - name: Install deps (frontend)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
        shell: bash
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build
        shell: bash
      - name: Verify build artifact
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html || { echo "::error::frontend/dist/index.html missing"; exit 2; }
        shell: bash
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      # <<< END MANAGED BLOCK: ci-guard:frontend-smoke-artifact

  backend-smoke:
    timeout-minutes: 15
    needs: [changes, frontend-build]
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    env:
      PORT: 3000
      DB_URL: postgres://user:pass@localhost:5432/testdb
      CI_REQUIRE_EXTERNAL: "0"
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v4
      # >>> BEGIN MANAGED BLOCK: ci-guard:frontend-smoke-artifact
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Re-verify artifact
        run: test -f frontend/dist/index.html
        shell: bash
      # <<< END MANAGED BLOCK: ci-guard:frontend-smoke-artifact
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm run setup
      - name: Start backend
        run: |
          npm run dev 2>&1 | tee /tmp/server.log &
          echo $! > /tmp/server.pid
        shell: bash
      - name: Wait for healthz
        run: npx wait-on http://localhost:3000/healthz --timeout 300000 || { cat /tmp/server.log; exit 1; }
        shell: bash
      - name: Run smoke script
        run: node scripts/smoke-server.js
      - name: Stop backend
        if: always()
        run: |
          kill $(cat /tmp/server.pid) || true
          sleep 5
          cat /tmp/server.log || true
        shell: bash
