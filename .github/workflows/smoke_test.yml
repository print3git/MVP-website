name: Server Smoke Test

env:
  HUSKY: 0


on:
  push:
    branches: [00000production]
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * *'
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-full')
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      DB_URL: postgres://user:pass@localhost:5432/testdb
      CI_REQUIRE_EXTERNAL: "0"
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v4
      - uses: ./.github/actions/frontend-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm run setup
      - name: Start backend
        run: |
          npm run dev 2>&1 | tee /tmp/server.log &
          echo $! > /tmp/server.pid
        shell: bash
      - name: Wait for healthz
        run: npx wait-on http://localhost:3000/healthz --timeout 300000 || { cat /tmp/server.log; exit 1; }
        shell: bash
      - name: Run smoke script
        run: node scripts/smoke-server.js
      - name: Stop backend
        if: always()
        run: |
          kill $(cat /tmp/server.pid) || true
          sleep 5
          cat /tmp/server.log || true
        shell: bash
