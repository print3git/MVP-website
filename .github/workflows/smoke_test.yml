name: Server Smoke Test

on:
  push:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npx tsc -p backend/tsconfig.build.json
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/lib
      - uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: backend-node-modules
          path: backend/node_modules

  smoke:
    needs: build
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      DB_URL: postgres://user:pass@localhost:5432/testdb
      CI_REQUIRE_EXTERNAL: "0"
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend/lib
      - uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules
      - uses: actions/download-artifact@v4
        with:
          name: backend-node-modules
          path: backend/node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start backend
        run: |
          npm run dev 2>&1 | tee /tmp/server.log &
          echo $! > /tmp/server.pid
        shell: bash
      - name: Wait for healthz
        run: npx wait-on http://localhost:3000/healthz --timeout 300000 || { cat /tmp/server.log; exit 1; }
        shell: bash
      - name: Run smoke script
        run: node scripts/smoke-server.js
      - name: Stop backend
        if: always()
        run: |
          kill $(cat /tmp/server.pid) || true
          sleep 5
          cat /tmp/server.log || true
        shell: bash
