name: GLB Tests

env:
  HUSKY: 0


on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/src/lib/**glb**'
      - 'backend/src/lib/**/*glb*.ts'
      - 'backend/src/pipeline/generateModel.*'
      - 'backend/tests/glb/**'
  merge_group:
    branches: [main, dev]
    paths:
      - 'backend/src/lib/**glb**'
      - 'backend/src/lib/**/*glb*.ts'
      - 'backend/src/pipeline/generateModel.*'
      - 'backend/tests/glb/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - name: Load Stripe env
        run: node scripts/ci-env-preflight.js
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Run unit tests
        run: npm run test:unit --prefix backend

  e2e-tests:
    needs: unit-tests
    runs-on: [self-hosted, linux, x64]
    env:
      PORT: 3000
      DB_URL: postgres://user:pass@localhost:5432/testdb
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - name: Load Stripe env
        run: node scripts/ci-env-preflight.js
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: echo "Cache key: ${{ steps.cache-playwright.outputs.cache-primary-key }}"
      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
        run: npx playwright install --with-deps
      - name: Start server and run e2e tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
        run: |
          npx -y concurrently -k -s first "npm run serve" "npx wait-on http://localhost:3000 --timeout 300000 && npx playwright test e2e/*.test.js"
