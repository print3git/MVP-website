name: Pipeline Deadlock Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deadlock:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save yaml
      - run: node --test tests/ci/pipeline-deadlock-check-b1a2c3d.test.js
