name: Backend Only CI

env:
  HUSKY: 0


on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      # shared files that affect both backend and frontend
      - '.github/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
    paths-ignore:
      - 'frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      # shared files that affect both backend and frontend
      - '.github/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
    paths-ignore:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: true
      matrix:
        shard: [aa, ab, ac]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install root dependencies
        run: |
          for attempt in 1 2; do
            if npm ci; then
              break
            elif [ $attempt -eq 2 ]; then
              exit 1
            else
              sleep $((2**attempt))
            fi
          done
      - name: Install backend dependencies
        run: |
          for attempt in 1 2; do
            if npm ci --prefix backend; then
              break
            elif [ $attempt -eq 2 ]; then
              exit 1
            else
              sleep $((2**attempt))
            fi
          done
      - name: Run backend tests
        run: |
          node scripts/run-jest.js backend --listTests | split -n l/3 - test-files-
          TEST_FILES=$(cat test-files-${{ matrix.shard }} | tr '\n' ' ')
          node scripts/run-jest.js --runTestsByPath $TEST_FILES --ci
