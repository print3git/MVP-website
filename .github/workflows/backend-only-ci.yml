name: Backend Only CI

env:
  HUSKY: 0

on:
  workflow_run:
    workflows: [ "Preflight" ]
    types:
      - completed
  workflow_dispatch:


concurrency: repo-ci

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/preflight.yml
    timeout-minutes: 15

  backend-tests:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' ||
      needs.preflight.outputs.run_backend == 'true'
    runs-on: [self-hosted, linux, x64, gha]
    continue-on-error: true
    strategy:
      fail-fast: true
      matrix:
        shard: [ aa, ab, ac ]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install root dependencies
        run: |
          for attempt in 1 2; do
            if npm ci; then
              break
            elif [ $attempt -eq 2 ]; then
              exit 1
            else
              sleep $((2**attempt))
            fi
          done
      - name: Install backend dependencies
        run: |
          for attempt in 1 2; do
            if npm ci --prefix backend; then
              break
            elif [ $attempt -eq 2 ]; then
              exit 1
            else
              sleep $((2**attempt))
            fi
          done
      - name: Prepare test files
        run: |
          node scripts/run-jest.js backend --listTests | split -n l/3 - test-files-
          echo "TEST_FILES=$(cat test-files-${{ matrix.shard }} | tr '\n' ' ')" >> $GITHUB_ENV
      - name: Run backend tests
        uses: ./.github/actions/with-test-telemetry
        env:
          TEST_FILES: ${{ env.TEST_FILES }}
        with:
          package-manager: npm
          run: >-
            node scripts/run-jest.js --runTestsByPath $TEST_FILES --ci --json --outputFile=test-results.json
          results-file: test-results.json
    timeout-minutes: 15
