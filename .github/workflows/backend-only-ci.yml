name: Backend Only CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [aa, ab, ac]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - name: Run backend tests
        run: |
          node scripts/run-jest.js backend --listTests | split -n l/3 - test-files-
          TEST_FILES=$(cat test-files-${{ matrix.shard }} | tr '\n' ' ')
          node scripts/run-jest.js --runTestsByPath $TEST_FILES --ci
