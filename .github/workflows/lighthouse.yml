name: Lighthouse

env:
  HUSKY: 0


on:
  deployment_status:
    types: [success]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    if: ${{ github.event.deployment_status.environment == 'preview' }}
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            backend/dalle_server/package-lock.json
            pnpm-lock.yaml
      - run: echo "cache-hit: ${{ steps.setup-node.outputs.cache-hit }}"
      - run: npm install --no-audit --no-fund
      - name: Run Lighthouse CI
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
        run: npx lhci autorun --config=lighthouserc-preview.json
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/*report.html
