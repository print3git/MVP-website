name: Lighthouse

env:
  HUSKY: 0


on:
  deployment_status:
    types: [success]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    timeout-minutes: 15
    if: ${{ github.event.deployment_status.environment == 'preview' }}
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Run Lighthouse CI
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
        run: npx lhci autorun --config=lighthouserc-preview.json
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/*report.html
