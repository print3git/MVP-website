name: Generate full CI from discovery

on:
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Discover tests
        run: node scripts/ci/discover-and-restore-tests.js
      - name: Commit results
        run: |
          if [ -n "$(git status --porcelain ci/generated/full-ci.yml ci/generated/full-ci.jobs.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "ci: update full ci configuration" || true
          fi
      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/auto-restore
          title: ci: auto-restore test workflow
          body: Automated restoration of missing test suites.
          labels: ci:auto-restore
          base: ${{ github.head_ref }}
