name: Frontend dry build

env:
  HUSKY: 0


on:
  pull_request:
    paths:
      - 'frontend/**'
      - '!docs/**'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm add -D vite --no-save --dir frontend
      - run: pnpm run build --prefix frontend
      - run: |
          test -f frontend/dist/index.html || { echo 'frontend/dist/index.html missing after build'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
