name: guard / lfs-prettier-guard
on: [pull_request, push]
jobs:
  lfs-prettier-guard:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - run: npx -y tsx scripts/ci-guard/lfs-prettier-guard/validate.ts
      - run: node scripts/run-jest.js tests/ci-guard/lfs-prettier-guard/validate.test.ts
