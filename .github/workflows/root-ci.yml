name: root-ci

on:
  push:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  root-ci:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      CI_NETWORK_OK: "1"
      AWS_DEFAULT_REGION: eu-north-1
      AWS_REGION: eu-north-1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Mode
        shell: bash
        run: |
          if [ "${CI_NO_NET:-0}" = "1" ]; then
            echo "Mode: Offline"
          else
            echo "Mode: Online"
          fi

      - name: Configure AWS via role (OIDC)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS via access keys
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch repo-assets from S3
        if: ${{ env.CI_NETWORK_OK == '1' && (secrets.AWS_ROLE_TO_ASSUME != '' || (secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '')) }}
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="glb-models-prod"
          PREFIX="repo-assets"
          mkdir -p ./repo-assets
          echo "Checking for s3://$BUCKET/$PREFIX ..."
          if aws s3 ls "s3://$BUCKET/$PREFIX" >/dev/null 2>&1; then
            echo "Syncing s3://$BUCKET/$PREFIX -> ./repo-assets"
            aws s3 sync "s3://$BUCKET/$PREFIX" ./repo-assets --only-show-errors
          else
            echo "Prefix not found; skipping sync."
          fi

      - name: Install deps
        shell: bash
        run: |
          if [ "${CI_NO_NET:-0}" = "1" ] || [ "${SKIP_PW_DEPS:-0}" = "1" ]; then
            npm ci --ignore-scripts --prefer-offline --no-audit --fund=false
          else
            npm ci
          fi

      - name: Build
        run: npm run build --workspaces=false

      - name: CI doctor
        run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test

      - name: Test
        run: npm test
