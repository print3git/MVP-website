name: root-ci

on:
  push:
  pull_request:

# keep for OIDC in case you add a role later
permissions:
  id-token: write
  contents: read

jobs:
  root-ci:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      CI_NETWORK_OK: "1"
      AWS_DEFAULT_REGION: eu-north-1
      AWS_REGION: eu-north-1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Verify expected test files
        run: node ci/check-test-files.js

      # ✅ NEW: fetch S3 assets before install/build
      - name: Fetch repo assets from S3
        uses: ./.github/actions/fetch-repo-assets
        with:
          bucket: glb-models-prod
          region: eu-north-1

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Mode
        shell: bash
        run: |
          if [ "${CI_NO_NET:-0}" = "1" ]; then
            echo "Mode: Offline"
          else
            echo "Mode: Online"
          fi

      - name: Install deps
        shell: bash
        run: |
          if [ "${CI_NO_NET:-0}" = "1" ] || [ "${SKIP_PW_DEPS:-0}" = "1" ]; then
            npm ci --ignore-scripts --prefer-offline --no-audit --fund=false
          else
            npm ci
          fi

      - name: Build
        run: npm run build --workspaces=false
        env:
          ASTRONAUT_GLB_URL: ${{ secrets.ASTRONAUT_GLB_URL }}

      - name: CI doctor
        run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test

      - name: Test
        run: npm test
