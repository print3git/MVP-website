jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - run: |
          aws s3 rm s3://glb-models-prod/repo-assets/test.txt || true
          aws s3 rm s3://glb-models-prod/repo-assets/infra.tfstate || true
          aws s3 cp /dev/null s3://glb-models-prod/repo-assets/.keep
          aws s3 cp /dev/null s3://glb-models-prod/user-models/.keep
