name: S3 Cleanup (one-time)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      S3_BUCKET: glb-models-prod
      AWS_REGION_S3: eu-north-1
    steps:
      - uses: actions/checkout@v4

      # Prefer OIDC role if you have one; otherwise fall back to keys.
      - name: Configure AWS (OIDC)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION_S3 }}

      - name: Configure AWS (keys)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION_S3 }}

      - name: Remove any objects outside the two allowed prefixes
        run: |
          set -euo pipefail
          echo "Objects outside allowed prefixes (should be empty):"
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" --query \
          "Contents[?!(starts_with(Key, 'repo-assets/') || starts_with(Key, 'user-models/'))].Key"

          # Example explicit deletions you mentioned:
          aws s3 rm "s3://$S3_BUCKET/repo-assets/test.txt" || true
          aws s3 rm "s3://$S3_BUCKET/repo-assets/infra.tfstate" || true

          # Keep the two top-level prefixes present
          aws s3 cp /dev/null "s3://$S3_BUCKET/repo-assets/.keep"
          aws s3 cp /dev/null "s3://$S3_BUCKET/user-models/.keep"
