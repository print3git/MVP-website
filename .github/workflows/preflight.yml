name: Preflight

env:
  HUSKY: 0

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - package.json
      - package-lock.json
      - .github/workflows/**
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - package.json
      - package-lock.json
      - .github/workflows/**
  merge_group:
  workflow_call:
    outputs:
      run_backend:
        description: Run backend jobs
        value: ${{ jobs.changed.outputs.backend }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe_runner:
    uses: ./.github/workflows/_runner-probe.yml

  changed:
    needs: [probe_runner]
    timeout-minutes: 15
    runs-on: ${{ fromJSON(steps.resolve.outputs.value) }}
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Resolve runner choice
        id: resolve
        uses: ./.github/actions/resolve-runs-on
        with:
          online: ${{ needs.probe_runner.outputs.online }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
