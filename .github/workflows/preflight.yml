name: Preflight

env:
  HUSKY: 0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_call:
    outputs:
      run_backend:
        description: Run backend jobs
        value: ${{ jobs.changed.outputs.backend }}

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
