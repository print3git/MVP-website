name: Jest open handles

env:
  HUSKY: 0


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest-open-handles:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            backend/dalle_server/package-lock.json
            pnpm-lock.yaml
      - run: echo "cache-hit: ${{ steps.setup-node.outputs.cache-hit }}"
      - name: Run Jest with open handles
        run: |
          npm test --prefix backend -- --detectOpenHandles --listTests --maxWorkers=50% 2>jest-stderr.log
      - name: Upload stderr
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-stderr
          path: jest-stderr.log
