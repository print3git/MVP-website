name: dependency-checker

on:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  check:
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # >>> BEGIN MANAGED BLOCK: ci-guard:pnpm-bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Enable corepack
        run: corepack enable
        shell: bash
      - name: Ensure pnpm installed (fallback)
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      # <<< END MANAGED BLOCK: ci-guard:pnpm-bootstrap

      - name: Check Node dependencies
        run: |
          (npm outdated || pnpm outdated) > node-outdated.txt 2>&1 || true
        continue-on-error: true

      - name: Check Python dependencies
        if: ${{ hashFiles('**/requirements.txt') != '' }}
        run: |
          pip list --outdated > python-outdated.txt 2>&1 || true
        continue-on-error: true

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            node-outdated.txt
            python-outdated.txt
          if-no-files-found: ignore
