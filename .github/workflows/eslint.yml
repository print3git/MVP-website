name: ESLint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: Use self-hosted runners
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labels:
    timeout-minutes: 15
    uses: ./.github/workflows/labels.yml
    with:
      use_self_hosted: ${{ inputs.use_self_hosted }}

  lint:
    timeout-minutes: 15
    needs: labels
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - uses: tj-actions/eslint-changed-files@v25.3.2
        with:
          extra_args: '--cache --cache-location .eslintcache --max-warnings 0'
          ignore_path: .eslintignore
