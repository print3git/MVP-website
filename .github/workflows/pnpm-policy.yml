name: pnpm policy

on:
  push:
    branches:
      - dev
      - 00000production
  pull_request:
    branches:
      - dev
      - 00000production
  workflow_call:

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      # >>> BEGIN MANAGED BLOCK: ci-guard:single-lockfile-policy
      - name: Enforce single lockfile policy (pnpm)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "::error::package-lock.json found at repo root; canonical manager is pnpm"; exit 1
          fi
          if compgen -G "**/package-lock.json" > /dev/null; then
            echo "::warning::Nested package-lock.json files detected. Add to allowlist if intentional."
          fi
      # <<< END MANAGED BLOCK: ci-guard:single-lockfile-policy
      - name: enable corepack
        run: corepack enable
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 9
          run_install: false
      - name: install dependencies
        run: pnpm install --no-frozen-lockfile
