name: "CI: pnpm install smoke"

on: [pull_request]

jobs:
  check-pnpm:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.11.0 }
      - run: pnpm --version
      - run: pnpm init -y
