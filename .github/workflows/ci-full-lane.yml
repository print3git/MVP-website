name: CI Full Lane
on:
  pull_request:
  push:
    branches:
      - dev
      - '00000production'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.probe.outputs.labels }}
    steps:
      - name: Probe self-hosted runners
        id: probe
        run: |
          gh api repos/${{ github.repository }}/actions/runners --jq '.runners[].labels[].name' > labels.txt
          echo "labels=$(tr '\n' ' ' < labels.txt)" >> "$GITHUB_OUTPUT"
  lint:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: lint
      command: npm run lint
  typecheck:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: typecheck
      command: npm run typecheck
  unit:
    needs: probe
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: unit
      command: npm test
      runner-labels: ${{ needs.probe.outputs.labels }}
  backend:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: backend
      command: npm test -- --backend
      use-self-hosted: true
  frontend:
    needs: probe
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: frontend
      command: npm test -- --frontend
      runner-labels: ${{ needs.probe.outputs.labels }}
  e2e:
    needs: probe
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: e2e
      command: npm run test:e2e
      runner-labels: ${{ needs.probe.outputs.labels }}
  docs:
    needs: probe
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: docs
      command: npm test -- --docs
      runner-labels: ${{ needs.probe.outputs.labels }}
  infra:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: infra
      command: npm test -- --infra
