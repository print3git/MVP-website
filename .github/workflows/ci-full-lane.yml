name: CI Full Lane
on:
  pull_request:
  push:
    branches:
      - dev
      - "00000production"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provision:
    uses: ./.github/workflows/aws-ec2-runner.yml
    secrets: inherit

  tests:
    needs: provision
    runs-on: [self-hosted, linux, aws-ec2]
    steps:
      - uses: actions/checkout@v4.1.6
      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
  lint:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: lint
      command: npm run lint
  typecheck:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: typecheck
      command: npm run typecheck
  unit:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: unit
      command: JEST_RETRIES=2 npm test -- --config scripts/ci/jest.config.ci.ts
  backend:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: backend
      command: npm ci && npm test --prefix backend -- --reporters=default
  frontend:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: frontend
      command: npm ci --prefix frontend && npm run build --prefix frontend || (echo "::error::frontend build failed"; exit 1)
  e2e:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: e2e
      command: |
        if [[ "${SKIP_PW_DEPS:-}" == "1" ]]; then
          echo "::warning::SKIP_PW_DEPS set; skipping Playwright deps"
        fi
        npm run test:e2e
  docs:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: docs
      command: |
        if [ -d docs ]; then
          npm ci --prefix docs && npm run build --prefix docs
        else
          echo "::warning::No docs directory, skipping"
        fi
  infra:
    uses: ./.github/workflows/reusable-test-job.yml
    with:
      suite: infra
      command: npm test -- --infra
  pnpm-sentinel:
    name: pnpm sentinel
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pnpm
        uses: ./.github/actions/ensure-pnpm
      - name: pnpm install
        run: pnpm install --ignore-scripts
      - name: Check lockfile
        id: lock
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "pnpm-lock.yaml unchanged"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "::warning::pnpm-lock.yaml changed during install"
          fi
      - name: Upload updated lockfile
        if: steps.lock.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock.yaml
          path: pnpm-lock.yaml
