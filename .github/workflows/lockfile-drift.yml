name: Lockfile drift

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - scripts/check-lockfile-drift.js
      - .github/workflows/lockfile-drift.yml

jobs:
  lockfile-drift:
    runs-on:
      - [self-hosted, linux, aws, small]
      - ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v4.0.2
        with:
          node-version: 20
      - run: node scripts/check-lockfile-drift.js
