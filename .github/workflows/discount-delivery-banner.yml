name: Discount/delivery banner test suite

on:
  push:
    branches: [dev, "00000production"]
  pull_request:
    branches: [dev, "00000production"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:banner
