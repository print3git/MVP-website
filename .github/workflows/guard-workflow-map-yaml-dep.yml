name: Guard workflow map yaml dep
on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/run-jest.js tests/ci-guard/workflow-map-yaml-dep/audit.test.ts
