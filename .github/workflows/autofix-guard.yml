name: autofix-guard

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  guard:
    if: >
      github.event.workflow_run.conclusion != 'success' &&
      !startsWith(github.event.workflow_run.name, 'autofix') &&
      !startsWith(github.event.workflow_run.name, 'CI Queue Monitor') &&
      !startsWith(github.event.workflow_run.name, 'CI Canary')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tooling
        run: |
          npm ci || npm i
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: Collect failing jobs & logs
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const github = require('@actions/github');
            const {owner, repo} = github.context.repo;
            const runId = github.context.payload.workflow_run.id;
            const octo = github.getOctokit(process.env.GITHUB_TOKEN);
            const jobs = await octo.rest.actions.listJobsForWorkflowRun({owner, repo, run_id: runId});
            const failing = jobs.data.jobs.filter(j => (j.conclusion && j.conclusion !== 'success'));
            const fs = require('fs'); const path = require('path');
            fs.mkdirSync('logs', {recursive:true});
            const summary = [];
            for (const j of failing) {
              try {
                const { data } = await octo.request('GET ' + j.html_url.replace('https://github.com','/repos'));
              } catch (e) {}
              summary.push({name:j.name, conclusion:j.conclusion, started_at:j.started_at, completed_at:j.completed_at, steps:j.steps?.map(s=>({name:s.name, conclusion:s.conclusion})) ?? []});
            }
            const runLogs = await octo.rest.actions.downloadWorkflowRunLogs({owner, repo, run_id: runId});
            const logUrl = runLogs.url;
            core.setOutput('log_url', logUrl);
            require('fs').writeFileSync('logs/failures.json', JSON.stringify({
              repo:`${owner}/${repo}`,
              workflow_run: github.context.payload.workflow_run,
              failing_jobs: summary
            }, null, 2));
            require('fs').writeFileSync('logs/summary.md',
              `# Autofix Guard Summary\n\n` +
              `**Workflow:** ${github.context.payload.workflow_run.name}\n` +
              `**Run ID:** ${runId}\n` +
              `**Conclusion:** ${github.context.payload.workflow_run.conclusion}\n\n` +
              summary.map(j => `- **${j.name}** → ${j.conclusion}`).join('\n') +
              `\n\nLogs (zip): ${logUrl}\n`
            );

      - name: Upload raw logs artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: autofix-guard-logs
          path: logs/

      - name: Run Codex driver to propose fixes
        id: drive
        run: |
          node scripts/autofix/codex-driver.js \
            --mode ci \
            --input logs/failures.json \
            --summary logs/summary.md \
            --out autofix_out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR with generated changes
        if: always()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "autofix: apply Codex suggestions for failing CI"
          title: "autofix: CI repair for ${{ github.event.workflow_run.name }} (#${{ github.event.workflow_run.id }})"
          body: |
            Generated by **autofix-guard**.

            Summary:
            ```
            ${{ steps.collect.outputs.log_url }}
            ```
            See attached `logs/summary.md`.

          branch: "autofix/fix-run-${{ github.run_id }}"
          labels: "autofix"
          add-paths: |
            logs/**
            autofix_out/**
          author: "print3git <actions@users.noreply.github.com>"
