name: Build frontend

env:
  HUSKY: 0


on:
  pull_request:
    paths:
      - 'frontend/**'
      - '!docs/**'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ matrix.node != 22 || contains(github.event.pull_request.labels.*.name, 'full-matrix') }}
    continue-on-error: ${{ matrix.node == 22 }}
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: true
      matrix:
        node: [20, 22]
        shard: [1, 2, 3]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
        if: ${{ matrix.shard == 1 }}
      - run: npm run build -- --ssr.split=${{ matrix.shard }}/3
      - run: test -d dist
      - run: node ../scripts/assert-frontend-dist.js
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ matrix.node }}-${{ matrix.shard }}
          path: frontend/dist
