name: Build frontend

on:
  pull_request:
    paths:
      - "frontend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - run: test -d dist
      - run: node ../scripts/assert-frontend-dist.js
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ matrix.node }}
          path: frontend/dist

  artifact-lister:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-20
          path: frontend/dist
      - run: |
          tar -czf frontend-dist.tar.gz -C frontend/dist .
          tar -tvf frontend-dist.tar.gz | tee frontend-dist-filetree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-filetree
          path: frontend-dist-filetree.txt
