name: Build frontend

env:
  HUSKY: 0


on:
  pull_request:
    paths:
      - "frontend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ matrix.node != 22 || contains(github.event.pull_request.labels.*.name, 'full-matrix') }}
    continue-on-error: ${{ matrix.node == 22 }}
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: true
      matrix:
        node: [20, 22]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v4
      - uses: ./.github/actions/frontend-build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm run lint && npm run build
      - run: test -d dist
      - run: node ../scripts/assert-frontend-dist.js
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ matrix.node }}
          path: frontend/dist

  artifact-lister:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-20
          path: frontend/dist
      - run: |
          tar -czf frontend-dist.tar.gz -C frontend/dist .
          tar -tvf frontend-dist.tar.gz | tee frontend-dist-filetree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-filetree
          path: frontend-dist-filetree.txt
