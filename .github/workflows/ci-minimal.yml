name: ci-minimal
on:
  pull_request:
  push:
    branches: [ dev, main, production ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: corepack enable
      - run: node -v && npm -v
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm -w build || npm run -w build || echo "no root build"
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test
  backend-unit:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm -w build || npm run -w build || echo "no root build"
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test
      - run: pnpm -w test:backend || pnpm -w test || echo "no backend unit tests defined"
