name: ci-minimal
on:
  pull_request:
  push:
    branches: [ dev, main, production ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: node -v && npm -v
      # Install root deps
      - run: npm ci
      # Install frontend deps (fixes missing @vitejs/plugin-react issue)
      - run: npm ci --prefix frontend
      # Build
      - run: npm run build --if-present
        env:
          ASTRONAUT_GLB_URL: ${{ secrets.ASTRONAUT_GLB_URL }}
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test

  backend-unit:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: node -v && npm -v
      # Install root deps
      - run: npm ci
      # Install backend deps
      - run: npm ci --prefix backend
      # Build
      - run: npm run build --if-present
        env:
          ASTRONAUT_GLB_URL: ${{ secrets.ASTRONAUT_GLB_URL }}
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test
      # Run backend unit tests
      - run: npm test --prefix backend || echo "no backend unit tests defined"
