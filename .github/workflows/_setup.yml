name: Setup

on:
  workflow_call:
    inputs:
      run:
        description: Command to execute after dependencies install
        required: true
        type: string
      use_self_hosted:
        description: Use self-hosted runners
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labels:
    uses: ./.github/workflows/labels.yml
    with:
      use_self_hosted: ${{ inputs.use_self_hosted }}

  run:
    needs: labels
    runs-on: ${{ fromJSON(needs.labels.outputs.runs_on_json) }}
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
        - run: npm ci
        - run: npm run ci:build-scripts
        - run: npm ci --prefix frontend
        - run: npm ci --prefix backend
      - run: ${{ inputs.run }}
