name: "Guard: github-script requires"
on:
  pull_request:
    paths: [".github/workflows/**/*.yml", "scripts/ci-guards/**"]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run guard
        run: node scripts/ci-guards/forbid-github-script-requires.js
