name: CI

on:
  push:
    branches: [main, dev, 00000production]
    # paths: # temporarily broadened to restore coverage
    #   - frontend/**
    #   - backend/**
    #   - package.json
    #   - package-lock.json
    #   - frontend/package-lock.json
    #   - backend/package-lock.json
    #   - pnpm-lock.yaml
    #   - .github/workflows/**
  pull_request:
    branches: [main, dev, 00000production]
    # paths: # temporarily broadened to restore coverage
    #   - frontend/**
    #   - backend/**
    #   - package.json
    #   - package-lock.json
    #   - frontend/package-lock.json
    #   - backend/package-lock.json
    #   - pnpm-lock.yaml
    #   - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  build:
    timeout-minutes: 15
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PORT: 3000
      CI_REQUIRE_EXTERNAL: "0"
    steps:
      - name: Heartbeat
        id: heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: REQUIRED
        id: required
        run: |
          echo 'REQUIRED: production build'
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, build
        id: build
        run: npm ci && npm run lint && npm run build
      - name: Verify dist output
        id: verify-dist
        run: test -d dist
      - name: Upload logs
        if: failure()
        id: upload-logs
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ github.job }}-logs
          path: ${{ runner.temp }}/_github_workflow/*.log
      - name: Job outcome
        if: success()
        run: echo '## Job outcome: 🟢 Success' >> "$GITHUB_STEP_SUMMARY"
      - name: Job outcome
        if: failure()
        run: |
          first_failed=$(echo '${{ toJSON(steps) }}' | jq -r 'to_entries|map(select(.value.outcome=="failure"))|first|.value.name')
          echo '## Job outcome: 🔴 Failure' >> "$GITHUB_STEP_SUMMARY"
          echo "First failing step: ${first_failed}" >> "$GITHUB_STEP_SUMMARY"

  test-backend:
    timeout-minutes: 15
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        shard: [aa, ab, ac]
    steps:
      - name: Heartbeat
        id: heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
      - name: Setup Node (root)
        id: setup-node-root
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
        - name: Install root dependencies
          id: npm-ci-root
          run: npm ci
        - name: Build scripts
          run: npm run ci:build-scripts
      - name: Setup Node (backend)
        id: setup-node-backend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        id: npm-ci-backend
        run: npm ci --prefix backend
      - name: Prepare test files
        run: |
          node scripts/run-jest.js backend --listTests | split -n l/3 - test-files-
          echo "TEST_FILES=$(cat test-files-${{ matrix.shard }} | tr '\n' ' ')" >> $GITHUB_ENV
      - name: Run backend tests
        id: run-tests
        uses: ./.github/actions/with-test-telemetry
        env:
          TEST_FILES: ${{ env.TEST_FILES }}
        with:
          package-manager: npm
          run: >-
            node scripts/run-jest.js --runTestsByPath $TEST_FILES --ci --coverage --coverageDirectory=coverage/backend --json --outputFile=test-results.json
          results-file: test-results.json
      - name: Upload junit
        id: upload-junit
        uses: actions/upload-artifact@v4.3.4
        with:
          name: junit-backend-${{ matrix.shard }}
          path: junit-backend.xml
          if-no-files-found: ignore
      - name: Upload coverage
        id: upload-coverage
        uses: actions/upload-artifact@v4.3.4
        with:
          name: coverage-backend-${{ matrix.shard }}
          path: coverage/backend
      - name: Upload logs
        if: failure()
        id: upload-logs
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ github.job }}-logs
          path: ${{ runner.temp }}/_github_workflow/*.log
      - name: Job outcome
        if: success()
        run: echo '## Job outcome: 🟢 Success' >> "$GITHUB_STEP_SUMMARY"
      - name: Job outcome
        if: failure()
        run: |
          first_failed=$(echo '${{ toJSON(steps) }}' | jq -r 'to_entries|map(select(.value.outcome=="failure"))|first|.value.name')
          echo '## Job outcome: 🔴 Failure' >> "$GITHUB_STEP_SUMMARY"
          echo "First failing step: ${first_failed}" >> "$GITHUB_STEP_SUMMARY"

  test-frontend:
    timeout-minutes: 15
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - shard: core
            pattern: 'frontend[^_]'
          - shard: gen-a
            pattern: 'generated_frontend_[0-7]'
          - shard: gen-b
            pattern: 'generated_frontend_[8-f]'
    steps:
      - name: Heartbeat
        id: heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
      - name: Setup Node (root)
        id: setup-node-root
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
        - name: Install root dependencies
          id: npm-ci-root
          run: npm ci
        - name: Build scripts
          run: npm run ci:build-scripts
      - uses: ./.github/actions/install-deps
      - name: Install frontend dependencies
        run: pnpm -C frontend install --no-frozen-lockfile
      - name: Run frontend tests
        id: run-tests
        uses: ./.github/actions/with-test-telemetry
        with:
          package-manager: pnpm
          run: >-
            node scripts/run-jest.js --testPathPattern "${{ matrix.pattern }}" --ci --coverage --coverageDirectory=coverage/frontend --json --outputFile=test-results.json
          results-file: test-results.json
      - name: Upload junit
        id: upload-junit
        uses: actions/upload-artifact@v4.3.4
        with:
          name: junit-frontend-${{ matrix.shard }}
          path: junit-frontend.xml
          if-no-files-found: ignore
      - name: Upload coverage
        id: upload-coverage
        uses: actions/upload-artifact@v4.3.4
        with:
          name: coverage-frontend-${{ matrix.shard }}
          path: coverage/frontend
      - name: Upload logs
        if: failure()
        id: upload-logs
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ github.job }}-logs
          path: ${{ runner.temp }}/_github_workflow/*.log
      - name: Job outcome
        if: success()
        run: echo '## Job outcome: 🟢 Success' >> "$GITHUB_STEP_SUMMARY"
      - name: Job outcome
        if: failure()
        run: |
          first_failed=$(echo '${{ toJSON(steps) }}' | jq -r 'to_entries|map(select(.value.outcome=="failure"))|first|.value.name')
          echo '## Job outcome: 🔴 Failure' >> "$GITHUB_STEP_SUMMARY"
          echo "First failing step: ${first_failed}" >> "$GITHUB_STEP_SUMMARY"

  test-integration:
    timeout-minutes: 15
    if: github.event_name == 'push'
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    steps:
      - name: Heartbeat
        id: heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
        - name: Install dependencies
          id: npm-ci
          run: npm ci
        - name: Build scripts
          run: npm run ci:build-scripts
      - name: Run integration tests
        id: run-tests
        uses: ./.github/actions/with-test-telemetry
        with:
          package-manager: npm
          run: >-
            node scripts/run-jest.js tests/integration --ci --coverage --coverageDirectory=coverage/integration --json --outputFile=test-results.json
          results-file: test-results.json
      - name: Upload junit
        id: upload-junit
        uses: actions/upload-artifact@v4.3.4
        with:
          name: junit-integration
          path: junit-integration.xml
          if-no-files-found: ignore
      - name: Upload coverage
        id: upload-coverage
        uses: actions/upload-artifact@v4.3.4
        with:
          name: coverage-integration
          path: coverage/integration
      - name: Upload logs
        if: failure()
        id: upload-logs
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ github.job }}-logs
          path: ${{ runner.temp }}/_github_workflow/*.log
      - name: Job outcome
        if: success()
        run: echo '## Job outcome: 🟢 Success' >> "$GITHUB_STEP_SUMMARY"
      - name: Job outcome
        if: failure()
        run: |
          first_failed=$(echo '${{ toJSON(steps) }}' | jq -r 'to_entries|map(select(.value.outcome=="failure"))|first|.value.name')
          echo '## Job outcome: 🔴 Failure' >> "$GITHUB_STEP_SUMMARY"
          echo "First failing step: ${first_failed}" >> "$GITHUB_STEP_SUMMARY"

  coverage-merge:
    timeout-minutes: 15
    if: github.event_name == 'push'
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    needs:
      - test-backend
      - test-frontend
      - test-integration
    steps:
      - name: Heartbeat
        id: heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        id: npm-ci
        run: npm ci --ignore-scripts
      - name: Download backend coverage
        id: download-backend
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: coverage-backend-*
          path: coverage/backend
          merge-multiple: true
      - name: Download frontend coverage
        id: download-frontend
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: coverage-frontend-*
          path: coverage/frontend
          merge-multiple: true
      - name: Download integration coverage
        id: download-integration
        uses: actions/download-artifact@v4.1.8
        with:
          name: coverage-integration
          path: coverage/integration
      - name: Merge coverage
        id: nyc-merge
        run: npx nyc merge coverage/backend coverage/frontend coverage/integration coverage/coverage-final.json
      - name: Generate lcov report
        id: nyc-report
        run: npx nyc report --reporter=lcov --report-dir=coverage
      - name: Upload lcov
        id: upload-lcov
        uses: actions/upload-artifact@v4.3.4
        with:
          name: lcov
          path: coverage/lcov.info
      - name: Upload logs
        if: failure()
        id: upload-logs
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ github.job }}-logs
          path: ${{ runner.temp }}/_github_workflow/*.log
      - name: Job outcome
        if: success()
        run: echo '## Job outcome: 🟢 Success' >> "$GITHUB_STEP_SUMMARY"
      - name: Job outcome
        if: failure()
        run: |
          first_failed=$(echo '${{ toJSON(steps) }}' | jq -r 'to_entries|map(select(.value.outcome=="failure"))|first|.value.name')
          echo '## Job outcome: 🔴 Failure' >> "$GITHUB_STEP_SUMMARY"
          echo "First failing step: ${first_failed}" >> "$GITHUB_STEP_SUMMARY"

  toolchain-debug:
    runs-on:
      - [self-hosted, linux, aws]
      - ubuntu-latest
    strategy:
      matrix:
        tool: [pnpm, vite, eslint, jest, tsc, wrangler, aws, docker]
    steps:
      - name: Show tool path and version
        run: |
          which ${{ matrix.tool }} || true
          ${{ matrix.tool }} --version || true
