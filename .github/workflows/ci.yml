name: CI

on:
  push:
    branches: [main, dev, '00000production']
  pull_request:
    branches: [main, dev, '00000production']

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            backend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'backend/package-lock.json') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium
      - name: Prepare apt cache
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown -R $USER:$USER /var/cache/apt/archives
      - uses: actions/cache@v5
        with:
          path: /var/cache/apt/archives
          key: pw-apt-${{ runner.os }}
          restore-keys: |
            pw-apt-${{ runner.os }}
      - name: Prime deps & browsers
        run: |
          chmod +x scripts/ci/prime-deps.sh
          ./scripts/ci/prime-deps.sh
      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            backend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'backend/package-lock.json') }}

  backend:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            backend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'backend/package-lock.json') }}
      - name: Restore Playwright cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium
      - name: Build/Test (offline-safe)
        env:
          NPM_REGISTRY: https://registry.npmjs.org/
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: |
          node -v && npm -v
          tsc ./scripts/ci/detect-network.ts --outDir scripts/ci || true
          chmod +x scripts/ci/run-backend-offline-safe.sh
          ./scripts/ci/run-backend-offline-safe.sh
      - name: Run Jest suites
        run: node scripts/run-jest.js tests/**/*.test.js
