name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    env:
      PORT: 3000
      CI_REQUIRE_EXTERNAL: "0"
    steps:
      - name: REQUIRED
        run: |
          echo 'REQUIRED: production build'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci && npm run lint && npm run build
      - run: test -d dist

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - name: Run backend tests
        run: node scripts/run-jest.js backend --ci --coverage --coverageDirectory=coverage/backend
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: junit-backend
          path: junit-backend.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: coverage-backend
          path: coverage/backend

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - name: Run frontend tests
        run: node scripts/run-jest.js frontend --ci --coverage --coverageDirectory=coverage/frontend
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: junit-frontend
          path: junit-frontend.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: coverage-frontend
          path: coverage/frontend

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run integration tests
        run: node scripts/run-jest.js tests/integration --ci --coverage --coverageDirectory=coverage/integration
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: junit-integration
          path: junit-integration.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: coverage-integration
          path: coverage/integration

  coverage-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs:
      - test-backend
      - test-frontend
      - test-integration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4.1.8
        with:
          name: coverage-backend
          path: coverage/backend
      - uses: actions/download-artifact@v4.1.8
        with:
          name: coverage-frontend
          path: coverage/frontend
      - uses: actions/download-artifact@v4.1.8
        with:
          name: coverage-integration
          path: coverage/integration
      - run: npx nyc merge coverage/backend coverage/frontend coverage/integration coverage/coverage-final.json
      - run: npx nyc report --reporter=lcov --report-dir=coverage
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: lcov
          path: coverage/lcov.info
