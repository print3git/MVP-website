name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: REQUIRED
        run: |
          echo 'REQUIRED: production build'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Production build
        run: npm run build

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: REQUIRED
        run: |
          echo 'REQUIRED: intent/behavior tests'
      - uses: actions/checkout@v5
      - name: Stripe preflight
        run: |
          echo "STRIPE_SECRET_KEY present: $([[ \"$STRIPE_SECRET_KEY\" =~ ^sk_ ]] && echo true || echo false)"
          echo "STRIPE_WEBHOOK_SECRET present: $([[ \"$STRIPE_WEBHOOK_SECRET\" =~ ^whsec_ ]] && echo true || echo false)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Clean npm proxy settings
        run: |
          unset NPM_CONFIG_HTTP_PROXY NPM_CONFIG_HTTPS_PROXY
          npm config delete proxy
          npm config delete https-proxy
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - run: npm ci
      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: npx playwright install --with-deps
      - name: Prepare test env
        run: |
          cp .env.example .env.test
          echo "DB_URL=postgres://user:pass@localhost/db" >> .env.test
      - name: Run tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: npm run test:ci
      - name: Run smoke tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: npm run smoke