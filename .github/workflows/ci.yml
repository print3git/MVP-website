name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium
      - name: Prime deps & browsers
        run: |
          chmod +x scripts/ci/prime-deps.sh
          ./scripts/ci/prime-deps.sh

  backend:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium
      - name: Build/Test (offline-safe)
        env:
          NPM_REGISTRY: https://registry.npmjs.org/
          # wire these if your env needs proxy
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: |
          node -v && npm -v
          tsc ./scripts/ci/detect-network.ts --outDir scripts/ci || true
          chmod +x scripts/ci/run-backend-offline-safe.sh
          ./scripts/ci/run-backend-offline-safe.sh
