name: CI
on:
  pull_request:
    branches: [ "dev", "production" ]
  push:
    branches: [ "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TZ: "Europe/London"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Lockfile guard: fail fast if package-lock.json would change
      - name: Verify lockfile matches package.json
        run: |
          cp package-lock.json package-lock.json.bak 2>/dev/null || true
          npm install --package-lock-only
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install' locally and commit the updated lockfile."
            exit 1
          fi
          # restore
          [ -f package-lock.json.bak ] && mv -f package-lock.json.bak package-lock.json || true

      - name: Clean install
        run: npm ci

      - name: Lint
        run: npm run lint || echo "no lint script or lint failed (non-blocking)"

      - name: Test
        run: npm run test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            npm-debug.log*
            reports/**
            coverage/**
          if-no-files-found: ignore
