name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  build:
    runs-on:
      - self-hosted
      - ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PORT: 3000
      CI_REQUIRE_EXTERNAL: "0"
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: REQUIRED
        run: |
          echo 'REQUIRED: production build'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-fe-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-fe-
      - run: npm ci && npm run lint && npm run build
      - run: test -d dist
      - if: failure()
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ github.job }}-logs
          path: ${{ runner.temp }}/_github_workflow/*.log

  test-backend:
    runs-on: ubuntu-latest-XXL
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        shard: [aa, ab, ac]
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - name: Run backend tests
        run: |
          node scripts/run-jest.js backend --listTests | split -n l/3 - test-files-
          TEST_FILES=$(cat test-files-${{ matrix.shard }} | tr '\n' ' ')
          node scripts/run-jest.js --runTestsByPath $TEST_FILES --ci --coverage --coverageDirectory=coverage/backend
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: junit-backend-${{ matrix.shard }}
          path: junit-backend.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: coverage-backend-${{ matrix.shard }}
          path: coverage/backend
      - if: failure()
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ github.job }}-logs
          path: ${{ runner.temp }}/_github_workflow/*.log

  test-frontend:
    runs-on:
      - self-hosted
      - ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - shard: core
            pattern: 'frontend[^_]'
          - shard: gen-a
            pattern: 'generated_frontend_[0-7]'
          - shard: gen-b
            pattern: 'generated_frontend_[8-f]'
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-fe-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-fe-
      - run: npm ci --prefix frontend
      - name: Run frontend tests
        run: node scripts/run-jest.js --testPathPattern "${{ matrix.pattern }}" --ci --coverage --coverageDirectory=coverage/frontend
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: junit-frontend-${{ matrix.shard }}
          path: junit-frontend.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: coverage-frontend-${{ matrix.shard }}
          path: coverage/frontend
      - if: failure()
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ github.job }}-logs
          path: ${{ runner.temp }}/_github_workflow/*.log

  test-integration:
    if: github.event_name == 'push'
    runs-on:
      - self-hosted
      - ubuntu-latest
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run integration tests
        run: node scripts/run-jest.js tests/integration --ci --coverage --coverageDirectory=coverage/integration
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: junit-integration
          path: junit-integration.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: coverage-integration
          path: coverage/integration
      - if: failure()
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ github.job }}-logs
          path: ${{ runner.temp }}/_github_workflow/*.log

  coverage-merge:
    if: github.event_name == 'push'
    runs-on:
      - self-hosted
      - ubuntu-latest
    needs:
      - test-backend
      - test-frontend
      - test-integration
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4.1.8
        with:
          pattern: coverage-backend-*
          path: coverage/backend
          merge-multiple: true
      - uses: actions/download-artifact@v4.1.8
        with:
          pattern: coverage-frontend-*
          path: coverage/frontend
          merge-multiple: true
      - uses: actions/download-artifact@v4.1.8
        with:
          name: coverage-integration
          path: coverage/integration
      - run: npx nyc merge coverage/backend coverage/frontend coverage/integration coverage/coverage-final.json
      - run: npx nyc report --reporter=lcov --report-dir=coverage
      - uses: actions/upload-artifact@v4.3.4
        with:
          name: lcov
          path: coverage/lcov.info
      - if: failure()
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ github.job }}-logs
          path: ${{ runner.temp }}/_github_workflow/*.log
