name: Diagnostics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: DIAGNOSTIC
        run: |
          echo 'DIAGNOSTIC: strict lint'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: DIAGNOSTIC
        run: |
          echo 'DIAGNOSTIC: dependency audit'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Audit root
        run: npm audit --audit-level=high
      - name: Audit backend
        run: npm audit --prefix backend --audit-level=high

  stripe_cloudflare:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: DIAGNOSTIC
        run: |
          echo 'DIAGNOSTIC: Stripe/Cloudflare smoke'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Cloudflare readiness
        run: npm run test:cf-readiness
      - name: Stripe webhook
        run: npm run test:webhook
