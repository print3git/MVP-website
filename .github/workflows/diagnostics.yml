name: Diagnostics

env:
  HUSKY: 0


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, aws]
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - run: echo "Shell=ok"
        shell: bash
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: DIAGNOSTIC
        run: |
          echo 'DIAGNOSTIC: strict lint'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint

  audit:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, aws]
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - run: echo "Shell=ok"
        shell: bash
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: DIAGNOSTIC
        run: |
          echo 'DIAGNOSTIC: dependency audit'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Audit root
        run: npm audit --audit-level=high
      - name: Audit backend
        run: npm audit --prefix backend --audit-level=high

  stripe_cloudflare:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, aws]
    timeout-minutes: 5
    continue-on-error: true
    env:
      CI_REQUIRE_EXTERNAL: "0"
    steps:
      - run: echo "Shell=ok"
        shell: bash
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - name: DIAGNOSTIC
        run: |
          echo 'DIAGNOSTIC: Stripe/Cloudflare smoke'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Cloudflare readiness
        run: npm run test:cf-readiness
      - name: Stripe webhook
        if: env.CI_REQUIRE_EXTERNAL == '1'
        run: npm run test:webhook
