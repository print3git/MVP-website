name: "astronaut .glb fallback: fetch and display, on index and payment page"

on:
  push:
    branches: [dev, '00000production']
  pull_request:
    branches: [dev, '00000production']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.6
      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-jest.js tests/astronaut-fallback
      - run: npm run test:astronaut-fallback:playwright
