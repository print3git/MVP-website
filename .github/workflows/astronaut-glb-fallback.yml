name: astronaut .glb fallback fetch/display on index and payment page

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.6
      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/run-jest.js tests/astronaut-fallback
