name: Deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
        env:
          ASTRONAUT_GLB_URL: ${{ secrets.ASTRONAUT_GLB_URL }}
      - name: Copy static site files
        run: |
          cp -a *.html frontend/dist/
          if [ -d img ]; then cp -a img frontend/dist/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
