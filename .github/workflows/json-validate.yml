name: JSON validate

on:
  pull_request:
    paths:
      - "**/*.json"

jobs:
  json-validate:
    runs-on:
      - [self-hosted, linux, aws]
      - [self-hosted, linux, x64, ci-small]
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v4.0.2
        with:
          node-version: 20
      - name: Validate JSON syntax
        run: |
          set -e
          for file in $(git ls-files '*.json'); do
            jq . "$file" >/dev/null
          done
      - name: Validate against schemas
        if: ${{ hashFiles('schemas/**') != '' }}
        run: |
          set -e
          for file in $(git ls-files '*.json'); do
            schema="schemas/$(basename "$file")"
            if [ -f "$schema" ]; then
              npx ajv-cli@5.0.0 validate -s "$schema" -d "$file"
            fi
          done
