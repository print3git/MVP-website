name: prettier scan-format tests

on:
  push:
  pull_request:

jobs:
  scan-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/run-jest.js tests/ci-guard/prettier-fix/scan-format.test.ts
