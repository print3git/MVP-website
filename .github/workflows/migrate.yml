name: Run DB migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: [self-hosted, ec2-migrations]   # use your EC2 runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20.x"
      - run: node scripts/ci-doctor.mjs
        env:
          STRIPE_SECRET_KEY: sk_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          DB_URL: postgres://postgres:postgres@localhost:5432/test
          SKIP_PW_DEPS: "1"

      - name: Install psql client (Amazon Linux)
        run: sudo dnf -y install postgresql15

      - name: Apply migrations
        env:
          DB_ADMIN_URL: ${{ secrets.DB_ADMIN_URL }}   # admin DB URL
        run: |
          set -euo pipefail
          for f in $(ls -1 migrations/*.sql | sort); do
            echo "Applying $f"
            psql "$DB_ADMIN_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
