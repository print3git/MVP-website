name: Queue Probe

env:
  HUSKY: 0


on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  probe:
    runs-on:
      - [self-hosted, linux, aws, small]
      - ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - run: echo "hello $GITHUB_RUN_ID"
