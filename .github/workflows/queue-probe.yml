name: Queue Probe

env:
  HUSKY: 0


on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - name: Print queue context
        run: |
          echo "Queue started: $(date)"
          echo "Runner: ${{ runner.name }}"
          echo "OS: ${{ runner.os }}"

  probe:
    needs: context
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Heartbeat
        run: |
          while true; do date; sleep 120; done &
      - run: echo "hello $GITHUB_RUN_ID"
