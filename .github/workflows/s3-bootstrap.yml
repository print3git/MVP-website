name: S3 two-folder bootstrap

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "S3 bucket name"
        required: true
        default: print2-repo-assets-dev
      region_s3:
        description: "S3 region (bucket's region)"
        required: true
        default: eu-north-1

jobs:
  run-bootstrap:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for OIDC (if using role assumption)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========= OPTION A: OIDC role (preferred) =========
      # If you have a role for Actions, set its ARN in a secret: AWS_ROLE_TO_ASSUME
      - name: Configure AWS via OIDC
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.region_s3 }}

      # ========= OPTION B: Static access keys =========
      # If you don't use OIDC, expose ACCESS KEY/SECRET as repo secrets
      - name: Configure AWS via static keys
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region_s3 }}

      # ubuntu-latest already has AWS CLI v2, but we’ll verify
      - name: Check AWS CLI
        run: aws --version

      - name: Make script executable
        run: chmod +x scripts/s3-two-folder-setup.sh

      - name: Run bootstrap (create bucket, enforce two prefixes)
        env:
          AWS_REGION_S3: ${{ github.event.inputs.region_s3 }}
          S3_BUCKET:     ${{ github.event.inputs.bucket }}
        run: |
          scripts/s3-two-folder-setup.sh

      - name: Verify layout
        env:
          S3_BUCKET: ${{ github.event.inputs.bucket }}
        run: |
          echo "Top-level prefixes:"
          aws s3 ls "s3://$S3_BUCKET/"
          echo "Anything outside allowed prefixes (should be empty list):"
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" --query \
            "Contents[?!(starts_with(Key, 'repo-assets/') || starts_with(Key, 'user-models/'))].Key"
