name: S3 Bootstrap

on:
  workflow_dispatch: {}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      # from repo secrets
      AWS_REGION_S3: ${{ secrets.AWS_REGION_S3 }}
      S3_BUCKET:     ${{ secrets.S3_BUCKET }}
      # optional: if you use OIDC + role, set this secret; otherwise leave empty
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

    steps:
      - uses: actions/checkout@v4

      # Use role if provided
      - name: Configure AWS via role (OIDC)
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION_S3 }}

      # Otherwise fall back to key pair
      - name: Configure AWS via keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION_S3 }}

      - name: Run S3 two-folder bootstrap
        run: |
          chmod +x scripts/s3-two-folder-setup.sh
          ./scripts/s3-two-folder-setup.sh
