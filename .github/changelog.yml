# Configuration for github-changelog-generator
# https://github.com/github-changelog-generator/github-changelog-generator

# labels to exclude from changelog
exclude_labels:
  - duplicate
  - question
  - invalid
  - wontfix
  - dependencies

# label mappings
enhancement_labels:
  - enhancement
  - feat
bug_labels:
  - bug
  - fix
breaking_labels:
  - breaking
